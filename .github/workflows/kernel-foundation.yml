name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-delivery-cancel' && inputs.expected_revision == 'ec4c09ea73d2c1bea007da987cd97dce11051e41' }}
    name: Linux signed installed explicit Delivery and terminal replay
    # Independent standard public runner; no feature override or replacement
    # for verifier, ordinary Run, shutdown or namespace qualification.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-run-client.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/installed-delivery-result.test.ts scripts/kernel/testing/installed-delivery-publication-result.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-client-consumer.test.ts scripts/kernel/testing/installed-control-client-driver.test.ts scripts/kernel/testing/installed-enroll-diagnostic.test.ts
      - name: Classify the actual Delivery cancellation refusal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          labels = {}
          for name in ['store', 'reducers/stop', 'recovery-closure', 'verifier-recovery', 'verifier-progress',
              'verifier-policy', 'verifier-permission-history', 'state-owner', 'control-channel', 'sqlite-driver',
              'worker-recovery', 'run-model-free', 'rows', 'errors', '../runtime/stop', '../policy/runtime-authority']:
              p = Path('src/state/' + name + '.ts')
              if p.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{8,150})'", p.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          p=Path('src/state/store.ts')
          source=p.read_text()
          needle = "      retainedAgent.cancelRun({ ...identity, requestId: value.requestId as string, expectedRunRevision: value.expectedRevision as number }));"
          assert source.count(needle) == 1
          source=source.replace(needle, """      retainedAgent.cancelRun({ ...identity, requestId: value.requestId as string, expectedRunRevision: value.expectedRevision as number })).catch(error => {
                try {
                  const fixed: Record<string,string> = __LABELS__, labels: string[] = [];
                  let cause: unknown = error;
                  for (let i=0; i<4 && cause instanceof Error; i++) {
                    const message = Object.getOwnPropertyDescriptor(cause, 'message')?.value;
                    const code = Object.getOwnPropertyDescriptor(cause, 'code')?.value;
                    const sqlite = Object.getOwnPropertyDescriptor(cause, 'errcode')?.value;
                    labels.push(typeof message === 'string' && Object.hasOwn(fixed, message) ? fixed[message]!
                      : typeof code === 'string' && /^(ERR_SQLITE_ERROR|REVISION_CONFLICT|RECOVERY_REQUIRED|ARTIFACT_MISMATCH|STATE_TRANSITION_INVALID|LEASE_FENCED)$/u.test(code)
                        ? code.toLowerCase() + (Number.isInteger(sqlite) && sqlite >= 0 && sqlite <= 65535 ? '_' + sqlite : '')
                        : cause instanceof TypeError ? 'type' : 'other');
                    cause = Object.getOwnPropertyDescriptor(cause, 'cause')?.value;
                  }
                  if (labels.length) process.stderr.write('CLIQ_PR536_DELIVERY_CANCEL_' + labels.join('__').slice(0,500) + '\\n');
                } catch {}
                throw error;
              });""".replace('__LABELS__', json.dumps(labels)))
          p.write_text(source)
          PY
      - run: npm run build
        id: build
      - name: Install actual guest, transport and Secret Service prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise explicit publication, drift merge, cancellation, reconnect and restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_delivery_cancel() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_DELIVERY_CANCEL_' |
              /bin/grep -E '^CLIQ_PR536_DELIVERY_CANCEL_[a-z0-9_]{1,500}$' |
              sort | uniq -c || true
          }
          trap report_delivery_cancel EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-delivery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-journey"
      - name: Retain only bounded installed Delivery and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-journey/*.json
          if-no-files-found: warn
          retention-days: 7

