name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery-delayed-volume:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-delivery-activate' && inputs.expected_revision == '81a9f8d0a1f4734f916d520b6ff9db4b739b9e5b' }}
    name: Linux installed Delivery on owned delayed storage
    # A separate free standard disposable VM, not a host/global-disk fixture.
    # This retains the ordinary complete Delivery assertions. Fixed timing
    # diagnostics do not qualify a late result or an in-flight stop by themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/supervisor-sea-builder.test.ts scripts/kernel/testing/installed-publication-retirement.test.ts scripts/kernel/testing/installed-publication-journal.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts
      - name: Add fixed activation-stage observations to the disposable Supervisor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/run-execution.ts')
          s = p.read_text()
          start = s.index('  async function activateWorker(')
          end = s.index('  /** Tool completion and stop drain', start)
          note = '''    const noteActivation = (phase: string) => {
                try { process.stderr.write('CLIQ_PR536_DELIVERY_ACTIVATE_' + phase + '\\n'); } catch {}
              };
          '''
          scope = s[start:end]
          steps = [
              ('    const reads = artifacts.withReadSignal(signal);', 'enter'),
              ('    preparation = await beginWorkerPreparation(', 'begin_preparation'),
              ('    const profile = decodeSandboxProfile(', 'select_profile'),
              ('    workspaceBirth = await materialization.birth();', 'directory_birth'),
              ('    const born = await recordWorkerPreparationGeneration(', 'record_birth'),
              ('    generation = await materialization.finish(', 'materialize'),
              ('    const authority = await generation.publishMaterializedAuthority();', 'publish_materialized'),
              ('    const preactivatedGeneration = await recordWorkspaceGenerationPreactivated(', 'preactivate_generation'),
              ('      controller = await launcher.startController({ signal });\n      reservation =', 'start_controller'),
              ('    const recipe = await publishWorkerRecipe(', 'publish_worker_recipe'),
              ('    const closure = await readWorkerLaunchClosure(', 'read_launch_closure'),
              ('    const binding = await controller.bindWorkerReservation(', 'bind_reservation'),
              ('    const reserved = await reserveWorkerLaunch(', 'reserve_launch'),
              ('    worker = await controller.launchWorker(', 'launch_worker'),
              ('    const processIdentity = await worker.observeProcess();', 'observe_process'),
              ('    const processContainmentRef = (await artifacts.publishCanonical(', 'publish_containment'),
              ('    const workerIdentityDigest = (await artifacts.publishCanonical(', 'publish_identity'),
              ('    await recordWorkerPreactivated(', 'record_worker'),
              ('    const activated = activateWorkerLeaseWithinDeadline(', 'activate_lease'),
              ('    await worker.activateCommitted(activated.launch);', 'activate_committed'),
              ('    return activeWorker;', 'return'),
          ]
          line = scope.index('\n') + 1
          scope = scope[:line] + note + scope[line:]
          for code, phase in steps:
              assert scope.count(code) in (1, 2)
              at = '\n' + code
              assert scope.count(at) in (1, 2)
              indentation = code[:len(code)-len(code.lstrip())]
              scope = scope.replace(at, '\n' + indentation + 'noteActivation(' + repr(phase) + ');' + at)
          s = s[:start] + scope + s[end:]
          needle = '      return ownOperation(work, abort, true);\n    },\n    executeCurrentNoOpDelivery:'
          assert s.count(needle) == 1
          observation = '''      return ownOperation(work, abort, true).catch(error => {
                  const observed = error instanceof KernelStorageError ? 'kernel_' + error.code.toLowerCase()
                    : error instanceof ResourceRetirementError ? 'retirement' : 'other';
                  try { process.stderr.write('CLIQ_PR536_DELIVERY_ACTIVATE_ERROR_' + observed + '\\n'); } catch {}
                  throw error;
                });
              },
              executeCurrentNoOpDelivery:'''
          p.write_text(s.replace(needle, observation))
          PY
      - run: npm run build
        id: build
      - name: Install actual guest, Secret Service and owned-volume prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config dmsetup kmod
      - name: Exercise both actual Linux root protocol-child lifetimes
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo "$probe_node" --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-publication-crash-observer.test.ts
      - name: Require the disposable hosted VM and its actual fixed delay target
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          if [[ ! -d /sys/module/dm_delay ]]; then sudo /usr/sbin/modprobe dm_delay; fi
          sudo /usr/bin/udevadm settle --timeout=5
          test -d /sys/module/dm_mod
          test -d /sys/module/dm_delay
          test -c /dev/mapper/control
      - name: Exercise the unchanged installed Delivery closure on the unique owned delayed volume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_activation_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=short-unix \
              --grep '^CLIQ_PR536_DELIVERY_ACTIVATE_' |
              /bin/grep -E ' CLIQ_PR536_DELIVERY_ACTIVATE_([a-z_]+|ERROR_[a-z_]+)$' |
              sed -E 's/^([0-9.]+).* (CLIQ_PR536_DELIVERY_ACTIVATE_.*)$/\1 \2/' |
              head -250 || true
          }
          trap report_activation_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --delay-volume --run-delivery-delay-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-delayed-volume"
      - name: Retain only bounded reports and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-delayed-volume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-delayed-volume/*.json
          if-no-files-found: warn
          retention-days: 7

