name: Kernel foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'cliq/**', 'codex/**']

permissions:
  contents: read

concurrency:
  group: kernel-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Public-repository qualification stays on free standard GitHub-hosted
  # runners. Do not switch these jobs to larger/paid runner labels.
  typescript:
    name: TypeScript (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22.13.0, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/check-design-contracts.test.mjs
      - run: node scripts/kernel/check-design-contracts.mjs
      - run: node scripts/kernel/test-linux-worker-text.mjs
      - run: npm run build
      - run: npm test

  linux-credential-authority:
    name: Linux installed credential authority diagnostics
    # The real credential journey and independent component baseline run in
    # parallel on free standard runners. This is not complete installed I1.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual platform and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev musl-tools bubblewrap strace
      - name: Exercise signed credential commands and Supervisor autostart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --credentials "$probe_node" "$RUNNER_TEMP/cliq-credential-journey"
      - name: Retain the bounded credential feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-credential-journey/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-credential-model-input:
    name: Linux installed model credential input diagnostics
    # Independently required with the lifecycle campaign. The exact negative
    # cases retain full real installation, platform checks, joins and scans.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual platform and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev musl-tools bubblewrap strace
      - name: Exercise signed model input refusals with complete independent retirement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --credentials-model-input "$probe_node" "$RUNNER_TEMP/cliq-credential-model-input"
      - name: Retain the bounded model-input credential feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-model-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-credential-model-input/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-finalizer-shutdown:
    name: Linux installed original credential finalizer ordinary SIGTERM
    # The owned external service stays on the actual disposable-user bus for
    # the whole scenario. This is not GNOME Keyring or full installed I1.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual signed image and D-Bus fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev musl-tools bubblewrap
      - name: Join the original installed finalizer before ordinary two-second stop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --credential-finalizer-shutdown "$probe_node" "$RUNNER_TEMP/cliq-finalizer-shutdown"
      - name: Retain only the bounded closed finalizer and unchanged-runner feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-finalizer-shutdown-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-finalizer-shutdown/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-authority-stop:
    name: Linux installed post-admission credential refusal and retirement
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Revoke the real admitted credential and require truthful retirement and restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-authority-failure-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-authority-stop"
      - name: Retain exact-source refusal and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-authority-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-authority-stop/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-settlement-storage:
    name: Linux installed original-claim settlement after actual CAS refusal
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-run-client.test.mjs
      - run: npm run build
        id: build
      - name: Install actual signed transport and bounded ext4 prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Refuse real CAS publication and settle the same original claim after exact restoration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-storage-failure-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-settlement-storage"
      - name: Retain exact-source storage refusal and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-settlement-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-settlement-storage/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-shutdown:
    name: Linux installed SIGTERM during admission
    # Independent ordinary Run-instruction and Session-Trust cuts. Keep the production
    # two-second service policy and the original full-journey scan bounds.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-run-client.test.mjs
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Stop the real Supervisor during positively observed instruction capture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-admission-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-admission"
      - name: Stop the real Supervisor during positively observed Session Trust enumeration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-session-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-session"
      - name: Retain bounded shutdown and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-admission/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain bounded Session shutdown and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-session/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-preparation-shutdown:
    name: Linux installed SIGTERM during preparation
    # Separate real scheduler/copy corpus; do not inflate the original full
    # campaign's fixed scan bounds or change the two-second service policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-run-client.test.mjs
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Stop the real scheduler during positively observed generation writes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-preparation-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-preparation"
      - name: Retain bounded shutdown and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-preparation/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-effects-shutdown:
    name: Linux installed SIGTERM preserves actual received tool and model effects
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-run-client.test.mjs
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Preserve the actual received private-tool result through ordinary stop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-received-tool-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-received-tool"
      - name: Preserve the original unknown model claim and charge before worker fencing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-pending-model-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-pending-model"
      - name: Stop a genuine retained-Run successor after native broker load and before public control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-shutdown-startup-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-shutdown-startup"
      - name: Retain bounded received-tool shutdown and unchanged-runner feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-received-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-received-tool/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain bounded pending-model shutdown and unchanged-runner feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-pending-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-pending-model/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain bounded startup shutdown and unchanged-runner feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-shutdown-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-shutdown-startup/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-request-resources:
    name: Linux installed request-byte compaction and terminal retirement
    # A separate fresh disposable UID keeps the original full journey and its
    # unchanged 4096-stream/512-MiB secret scan independent of this workload.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-run-client.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/installed-worker-lease.test.ts
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Exercise byte-triggered whole-prefix compaction and genuine queued successor progress
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-request-resource-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-request-resources"
      - name: Retain only bounded closed resource and unchanged-runner feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-request-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-request-resources/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-run:
    name: Linux signed installed Run closed-loop diagnostics
    # Real installed/manager/native transport mechanics, not complete I1 or a
    # qualified provider. Reuse the unmodified qualified 22.04 sandbox policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-run-client.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/installed-worker-lease.test.ts
      - run: npm run build
        id: build
      - name: Install actual signed transport and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap e2fsprogs
      - name: Compile the native transport with visible compiler diagnostics
        run: node scripts/kernel/build-linux-model-broker.mjs "$RUNNER_TEMP/cliq-model-broker-compile"
      - name: Exercise actual installed Run, ready Checkpoint, reconnect and restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-run-journey"
      - name: Retain bounded installed Run and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-run-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-run-journey/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise one received rejection through the actual installed terminal drain
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-failure-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-run-failure-journey"
      - name: Retain independent received-rejection and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-run-failure-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-run-failure-journey/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise real preparation refusal and exact-alias restoration on the same installed Run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-retry-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-run-retry-journey"
      - name: Retain independent pre-dispatch retry and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-run-retry-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-run-retry-journey/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-supervisor-preflight:
    name: Linux Supervisor image and actual user-manager diagnostics
    # Component/OS facts only, not an installed I1 qualification. Standard
    # public-repository runner; never substitute a detached child manager.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual platform and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev musl-tools bubblewrap strace
      # These independent disposable fixtures must not spend the stateful
      # credential journey's unchanged budget. Keep their exact assertions
      # on the same qualified OS/Node baseline; no authority crosses jobs.
      - name: Bound the genuine native credential queue and connection retirement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/credential-platform-queue.test.ts
          scripts/kernel/testing/credential-platform-timeout.test.ts
          scripts/kernel/testing/model-broker-preparation-lifecycle.test.ts
      - name: Verify the bounded secret scan before collecting credential artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --test --import tsx
          scripts/kernel/testing/credential-secret-scan.test.ts
          scripts/kernel/testing/credential-secret-corpus.test.ts
      - name: Reject unsupported credential schemas through the signed entry
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --test --import tsx scripts/kernel/testing/credential-authority-journey.test.ts
      - name: Verify installed-state and native-retirement boundaries on Linux 22.04
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # These component tests also run in the 24.04 matrix. Keep the real
        # installed/native boundary on the qualified 22.04 baseline too;
        # they do not substitute for the systemd installed execution chain.
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/state/installed-runtime.test.ts
          src/state/installed-genesis.test.ts
          src/state/installed-native-loader.test.ts
          src/state/installed-genesis-boundaries.test.ts
          src/state/genesis-schema-boundaries.test.ts
          src/state/supervisor-observation.test.ts
          src/state/installed-control.test.ts
          src/state/installed-control-client.test.ts
          src/sandbox/native-controller-close.test.ts
          scripts/kernel/sqlite-extension-headers.test.ts
          scripts/kernel/testing/installed-read-control.test.ts
          scripts/kernel/qualify-sqlite-paths.test.ts
          scripts/kernel/testing/sqlite-vfs-mechanism.test.ts
          scripts/kernel/testing/credential-vfs-probe.test.ts
          scripts/kernel/testing/credential-vfs-lock.test.ts
          scripts/kernel/testing/credential-vfs-crash.test.ts
          scripts/kernel/testing/credential-vfs-retirement.test.ts
          scripts/kernel/testing/credential-vfs-storage.test.ts
          scripts/kernel/testing/credential-authority-native.test.ts
          scripts/kernel/testing/credential-authority-bridge.test.ts
          scripts/kernel/testing/credential-authority-installed.test.ts
          scripts/kernel/testing/endpoint-authority-installed.test.ts
          scripts/kernel/testing/endpoint-authority-journey.test.ts
          scripts/kernel/testing/endpoint-wal-proof.test.ts
          scripts/kernel/testing/endpoint-authority-crash.test.ts
      - name: Qualify complete application image binding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx scripts/kernel/qualify-supervisor-image.ts "$RUNNER_TEMP/cliq-supervisor-image"
      - name: Observe real systemd-user delegation and restart identities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh "$probe_node" "$RUNNER_TEMP/cliq-systemd-user"
      - name: Qualify actual installed SEA closed-role and missing-keeper refusals
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx scripts/kernel/qualify-installed-startup.ts "$RUNNER_TEMP/cliq-installed-startup"
      - name: Qualify signed keeper handoff, genesis and Supervisor restart under the user manager
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --installed "$probe_node" "$RUNNER_TEMP/cliq-installed-keeper"
      - name: Observe real credential platform and SQLite path prerequisites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --secrets "$probe_node" "$RUNNER_TEMP/cliq-secret-service"
      - name: Reject unresolved installed preactivation before publishing the Store
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --installed-retirement-refusal "$probe_node" "$RUNNER_TEMP/cliq-installed-retirement"
      - name: Retain bounded component and lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-supervisor-image/report.json
            ${{ runner.temp }}/cliq-systemd-user/*.json
            ${{ runner.temp }}/cliq-installed-startup/report.json
            ${{ runner.temp }}/cliq-installed-keeper/*.json
            ${{ runner.temp }}/cliq-secret-service/*.json
            ${{ runner.temp }}/cliq-installed-retirement/*.json
            ${{ runner.temp }}/cliq-endpoint-crash-*/**
          if-no-files-found: warn
          retention-days: 7

  linux-strong-probe:
    name: Linux namespace and cgroup qualification
    # Ubuntu 24.04's hosted image denies the network-namespace setup under
    # its default AppArmor user-namespace policy. Keep 24.04 in the build/test
    # matrix, but qualify authority only on the unmodified 22.04 policy.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci

      - name: Install probe toolchain
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools

      - name: Record qualification baseline
        shell: bash
        run: |
          printf 'runner-image-os=%s\n' "${ImageOS:-unknown}"
          printf 'runner-image-version=%s\n' "${ImageVersion:-unknown}"
          uname -a
          bwrap --version
          musl-gcc --version

      - name: Build pinned Linux probe
        id: build
        shell: bash
        run: |
          installation="$RUNNER_TEMP/cliq-linux-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          output=$(scripts/kernel/build-linux-execution-probe.sh "$installation")
          printf '%s\n' "$output"
          printf 'installation=%s\n' "$installation" >> "$GITHUB_OUTPUT"
          printf 'manifest_digest=%s\n' "$(printf '%s\n' "$output" | sed -n 's/^MANIFEST_DIGEST=//p')" >> "$GITHUB_OUTPUT"

      - name: Delegate one disposable cgroup subtree
        id: cgroup
        shell: bash
        run: |
          cgroup_root=/sys/fs/cgroup
          parent="$cgroup_root/cliq-m0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir "$parent"
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          for controller in cpu memory pids; do
            grep -qw "$controller" "$parent/cgroup.controllers" || {
              echo "required cgroup controller is unavailable: $controller" >&2
              exit 1
            }
          done
          printf '+cpu +memory +pids\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          supervisor="$parent/supervisor"
          sudo mkdir "$supervisor"

          runner_owner="$(id -u):$(id -g)"
          sudo chown "$runner_owner" "$parent"
          while IFS= read -r delegated_file; do
            [ -e "$parent/$delegated_file" ] || continue
            sudo chown "$runner_owner" "$parent/$delegated_file"
          done < /sys/kernel/cgroup/delegate
          sudo chmod 0700 "$parent"

          scratch="$RUNNER_TEMP/cliq-m0-scratch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_root="$RUNNER_TEMP/cliq-m0-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$scratch" "$state_root"
          printf 'supervisor=%s\n' "$supervisor" >> "$GITHUB_OUTPUT"
          printf 'scratch=%s\n' "$(realpath "$scratch")" >> "$GITHUB_OUTPUT"
          printf 'state_root=%s\n' "$(realpath "$state_root")" >> "$GITHUB_OUTPUT"
          printf 'workspace=%s\n' "$(realpath "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"
          printf 'home=%s\n' "$(realpath "$HOME")" >> "$GITHUB_OUTPUT"

      - name: Run real Linux qualification
        env:
          CLIQ_LINUX_PROBE_INSTALLATION: ${{ steps.build.outputs.installation }}
          CLIQ_LINUX_PROBE_MANIFEST_DIGEST: ${{ steps.build.outputs.manifest_digest }}
          CLIQ_LINUX_PROBE_CGROUP_PARENT: ${{ steps.cgroup.outputs.parent }}
          CLIQ_LINUX_PROBE_SUPERVISOR_CGROUP: ${{ steps.cgroup.outputs.supervisor }}
          CLIQ_LINUX_PROBE_SCRATCH_ROOT: ${{ steps.cgroup.outputs.scratch }}
          CLIQ_LINUX_PROBE_WORKSPACE: ${{ steps.cgroup.outputs.workspace }}
          CLIQ_LINUX_PROBE_STATE_ROOT: ${{ steps.cgroup.outputs.state_root }}
          CLIQ_LINUX_PROBE_HOME: ${{ steps.cgroup.outputs.home }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          npm_path=$(command -v npm)
          sudo --preserve-env=CLIQ_LINUX_PROBE_INSTALLATION,CLIQ_LINUX_PROBE_MANIFEST_DIGEST,CLIQ_LINUX_PROBE_CGROUP_PARENT,CLIQ_LINUX_PROBE_SUPERVISOR_CGROUP,CLIQ_LINUX_PROBE_SCRATCH_ROOT,CLIQ_LINUX_PROBE_WORKSPACE,CLIQ_LINUX_PROBE_STATE_ROOT,CLIQ_LINUX_PROBE_HOME \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NPM_PATH="$npm_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_LINUX_PROBE_SUPERVISOR_CGROUP/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NPM_PATH" run test:sandbox-probe:linux
            '

      - name: Remove delegated cgroup subtree
        if: always() && steps.cgroup.outputs.parent != ''
        env:
          CLIQ_CGROUP_PARENT: ${{ steps.cgroup.outputs.parent }}
        shell: bash
        run: |
          printf '1\n' | sudo tee "$CLIQ_CGROUP_PARENT/cgroup.kill" >/dev/null 2>&1 || true
          for attempt in {1..100}; do
            grep -q '^populated 0$' "$CLIQ_CGROUP_PARENT/cgroup.events" && break
            sleep 0.05
          done
          grep -q '^populated 0$' "$CLIQ_CGROUP_PARENT/cgroup.events"
          while IFS= read -r -d '' child; do
            sudo rmdir "$child"
          done < <(find "$CLIQ_CGROUP_PARENT" -mindepth 1 -depth -type d -print0)
          sudo rmdir "$CLIQ_CGROUP_PARENT"

  linux-run-execution:
    name: Real Linux Run execution and recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools e2fsprogs
      - name: Verify real worker seccomp ABI and syscall denials
        shell: bash
        run: |
          regression="$RUNNER_TEMP/cliq-worker-seccomp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          musl-gcc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -idirafter /usr/include -idirafter "/usr/include/$(musl-gcc -dumpmachine)" \
            native/linux/worker-seccomp.test.c -o "$regression"
          "$regression"
      - name: Build real execution images
        id: images
        shell: bash
        run: |
          installation="$RUNNER_TEMP/cliq-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/kernel/build-linux-worker.mjs "$installation"
          printf 'installation=%s\n' "$installation" >> "$GITHUB_OUTPUT"
          foreign_installation="${installation}-foreign-owner"
          mkdir -m 0700 "$foreign_installation"
          printf 'foreign_installation=%s\n' "$foreign_installation" >> "$GITHUB_OUTPUT"
          for image in linux-worker.node cliq-linux-worker-controller cliq-linux-worker cliq-linux-edit cliq-linux-bubblewrap; do
            cp -- "$installation/$image" "$foreign_installation/$image"
          done
          chmod 0555 "$foreign_installation/linux-worker.node"
          sudo chown 65534:65534 "$foreign_installation/linux-worker.node"
      - name: Create disposable persistent state volume and delegated cgroup
        id: fixture
        shell: bash
        run: |
          parent="/sys/fs/cgroup/cliq-i1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          sudo mkdir "$parent"
          for controller in cpu memory pids; do
            grep -qw "$controller" "$parent/cgroup.controllers"
          done
          printf '+cpu +memory +pids\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo mkdir "$parent/supervisor"
          sudo chown "$(id -u):$(id -g)" "$parent"
          while IFS= read -r delegated_file; do
            [ -e "$parent/$delegated_file" ] || continue
            sudo chown "$(id -u):$(id -g)" "$parent/$delegated_file"
          done < /sys/kernel/cgroup/delegate
          sudo chmod 0700 "$parent"
          volume="$RUNNER_TEMP/cliq-i1-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$RUNNER_TEMP/cliq-i1-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ext4"
          printf 'volume=%s\nimage=%s\n' "$volume" "$image" >> "$GITHUB_OUTPUT"
          mkdir -m 0700 "$volume"
          truncate -s 128M "$image"
          mkfs.ext4 -q -F "$image"
          sudo mount -o loop,nodev,nosuid,noexec "$image" "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          sudo chmod 0700 "$volume"
          uname -a
          bwrap --version
          stat -f -c 'state-volume-type=%T capacity-blocks=%b block-size=%S' "$volume"
      - name: Reject a readable foreign-owned signed native installation
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_FOREIGN_INSTALLATION: ${{ steps.images.outputs.foreign_installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
        run: node --import tsx scripts/kernel/check-linux-worker-installation.ts "$CLIQ_I1_INSTALLATION" "$CLIQ_I1_FOREIGN_INSTALLATION" "$CLIQ_I1_CGROUP_PARENT"
      - name: Observe the actual first controller fork in its protected anchor
        # Test-only independent root tracer; offline campaign prefix, not the
        # installed signed Supervisor I1 or a durable worker death witness.
        # Stay outside the disposable cgroup and move only the owned child.
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_STATE_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          node_path=$(realpath "$(command -v node)")
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT,CLIQ_I1_STATE_VOLUME \
            "$node_path" scripts/kernel/qualify-controller-anchor-birth.mjs
      - name: Refuse failed retirement of the exact real controller leaf
        id: leaf_retirement
        # Test-only syscall-result interposer; genuine controller HELLO and
        # exact child join, not installed I1 or whole-worker death evidence.
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          node_path=$(command -v node)
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NODE_PATH="$node_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_I1_CGROUP_PARENT/supervisor/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NODE_PATH" scripts/kernel/testing/controller-leaf-retirement.mjs
            '
      - name: Exercise actual StateStore and native lifecycle
        # Keep the independent image/StateStore regression observable even
        # when the preceding leaf-retirement regression demonstrates a bug.
        if: ${{ !cancelled() && (success() || steps.leaf_retirement.outcome == 'failure') }}
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_STATE_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          node_path=$(command -v node)
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT,CLIQ_I1_STATE_VOLUME \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NODE_PATH="$node_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_I1_CGROUP_PARENT/supervisor/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NODE_PATH" --import tsx scripts/kernel/run-linux-worker-campaign.ts
            '
      - name: Retire disposable execution resources
        if: always() && steps.fixture.outputs.parent != ''
        env:
          CLIQ_I1_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          if [ -d "$CLIQ_I1_PARENT" ]; then
            printf '1\n' | sudo tee "$CLIQ_I1_PARENT/cgroup.kill" >/dev/null
            for attempt in {1..100}; do
              grep -q '^populated 0$' "$CLIQ_I1_PARENT/cgroup.events" && break
              sleep 0.05
            done
            grep -q '^populated 0$' "$CLIQ_I1_PARENT/cgroup.events"
            while IFS= read -r -d '' child; do sudo rmdir "$child"; done < <(find "$CLIQ_I1_PARENT" -mindepth 1 -depth -type d -print0)
            sudo rmdir "$CLIQ_I1_PARENT"
          fi
          if [ -n "$CLIQ_I1_VOLUME" ] && mountpoint -q "$CLIQ_I1_VOLUME"; then sudo umount "$CLIQ_I1_VOLUME"; fi
      - name: Remove the independent ownership regression installation
        if: always() && steps.images.outputs.foreign_installation != ''
        env:
          CLIQ_I1_FOREIGN_INSTALLATION: ${{ steps.images.outputs.foreign_installation }}
        shell: bash
        run: |
          for image in linux-worker.node cliq-linux-worker-controller cliq-linux-worker cliq-linux-edit cliq-linux-bubblewrap; do
            rm -f -- "$CLIQ_I1_FOREIGN_INSTALLATION/$image"
          done
          rmdir -- "$CLIQ_I1_FOREIGN_INSTALLATION"
