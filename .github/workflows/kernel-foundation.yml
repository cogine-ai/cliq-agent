name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-ambiguity' && inputs.expected_revision == '2dbcbbd9b1be943e07683d4afe194dcb7831dd6a' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Record only closed original MCP ambiguity phase labels
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          paths = ('src/state/run-execution.ts', 'src/state/mcp-execution.ts', 'src/state/mcp-stdio-unknown.ts',
              'src/state/mcp-stdio-execution.ts', 'src/state/worker-recovery.ts', 'src/state/reducers/invocation.ts',
              'src/state/installed-runtime.ts', 'src/state/repositories/journal.ts', 'src/kernel/broker-ambiguity.ts')
          labels = {}
          for p in paths:
              path = Path(p)
              if path.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,150})'", path.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for path in Path('native/linux').glob('*mcp*.h'):
              for msg in re.findall(r'"(mcp_[a-z0-9_]{2,80})"', path.read_text()):
                  labels[msg] = msg

          p = Path('src/state/run-execution.ts')
          s = p.read_text()
          start = s.index("        if (prepared.target.execution.kind === 'mcp') {", s.index('const currentWorker = worker;'))
          end = s.index("        builtinPhase('tool_claim_spec');", start)
          body = s[start:end]
          body = body.replace("        if (prepared.target.execution.kind === 'mcp') {", '''        if (prepared.target.execution.kind === 'mcp') {
                    let diagnosticStep = 'enter';
                    const diagnostic = (step: string, error?: unknown) => {
                      try {
                        diagnosticStep = step;
                        const fixed: Record<string, string> = __LABELS__;
                        const labels: string[] = [];
                        let candidate = error;
                        for (let i = 0; i < 4 && candidate instanceof Error; i++) {
                          const message = Object.getOwnPropertyDescriptor(candidate, 'message')?.value;
                          const brokerCode = Object.getOwnPropertyDescriptor(candidate, 'brokerCode')?.value;
                          const code = Object.getOwnPropertyDescriptor(candidate, 'code')?.value;
                          labels.push(typeof brokerCode === 'string' && Object.hasOwn(fixed, brokerCode) ? fixed[brokerCode]!
                            : typeof message === 'string' && Object.hasOwn(fixed, message) ? fixed[message]!
                            : typeof code === 'string' && /^(RECOVERY_REQUIRED|LEASE_FENCED|REVISION_CONFLICT|ERR_CLIQ_RESOURCE_RETIREMENT)$/u.test(code) ? code.toLowerCase()
                            : candidate instanceof TypeError ? 'type' : 'other');
                          candidate = Object.getOwnPropertyDescriptor(candidate, 'cause')?.value;
                        }
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_' + diagnosticStep + (labels.length ? '__' + labels.join('__') : '') + '\\n');
                      } catch {}
                    };'''.replace('__LABELS__', json.dumps(labels)), 1)
          steps = [
           ("            const received = await actual.result();", "            const received = await actual.result().catch(error => { diagnostic('stdio_result_refused', error); throw error; });\n            diagnostic('stdio_result_' + received.kind);"),
           ("                if (!settled) { await uncertain.finish(); settled = true; }",
            "                if (!settled) { diagnostic('stdio_unknown_settlement'); await uncertain.finish().catch(error => { diagnostic('stdio_unknown_refused', error); throw error; }); settled = true; diagnostic('stdio_unknown_settled'); }"),
           ("              const custody = readMcpRunResourceOwner(native, binding);",
            "              diagnostic('http_protocol_refused', error);\n              const custody = readMcpRunResourceOwner(native, binding);\n              diagnostic(custody.joined ? 'http_joined' : 'http_join_missing');"),
           ("                      else settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)).run;",
            "                      else {\n                        diagnostic('http_unknown_settlement');\n                        settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)\n                          .catch(error => { diagnostic('http_unknown_refused', error); throw error; })).run;\n                        diagnostic('http_unknown_settled');\n                      }"),
          ]
          for old, new in steps:
              assert body.count(old) == 1, old
              body = body.replace(old, new)
          p.write_text(s[:start] + body + s[end:])
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_AMBIGUITY_' |
              /bin/grep -E '^CLIQ_PR536_AMBIGUITY_[a-z0-9_]{1,650}$' |
              head -80 || true
          }
          trap report_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

  linux-installed-mcp-recovery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-ambiguity' && inputs.expected_revision == '2dbcbbd9b1be943e07683d4afe194dcb7831dd6a' }}
    name: Linux signed MCP status, retry and owning shutdown
    # Public repository: standard free runner, with the original production
    # build, lifecycle, billing and deadline assertions left intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Record only closed original MCP ambiguity phase labels
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          paths = ('src/state/run-execution.ts', 'src/state/mcp-execution.ts', 'src/state/mcp-stdio-unknown.ts',
              'src/state/mcp-stdio-execution.ts', 'src/state/worker-recovery.ts', 'src/state/reducers/invocation.ts',
              'src/state/installed-runtime.ts', 'src/state/repositories/journal.ts', 'src/kernel/broker-ambiguity.ts')
          labels = {}
          for p in paths:
              path = Path(p)
              if path.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,150})'", path.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for path in Path('native/linux').glob('*mcp*.h'):
              for msg in re.findall(r'"(mcp_[a-z0-9_]{2,80})"', path.read_text()):
                  labels[msg] = msg

          p = Path('src/state/run-execution.ts')
          s = p.read_text()
          start = s.index("        if (prepared.target.execution.kind === 'mcp') {", s.index('const currentWorker = worker;'))
          end = s.index("        builtinPhase('tool_claim_spec');", start)
          body = s[start:end]
          body = body.replace("        if (prepared.target.execution.kind === 'mcp') {", '''        if (prepared.target.execution.kind === 'mcp') {
                    let diagnosticStep = 'enter';
                    const diagnostic = (step: string, error?: unknown) => {
                      try {
                        diagnosticStep = step;
                        const fixed: Record<string, string> = __LABELS__;
                        const labels: string[] = [];
                        let candidate = error;
                        for (let i = 0; i < 4 && candidate instanceof Error; i++) {
                          const message = Object.getOwnPropertyDescriptor(candidate, 'message')?.value;
                          const brokerCode = Object.getOwnPropertyDescriptor(candidate, 'brokerCode')?.value;
                          const code = Object.getOwnPropertyDescriptor(candidate, 'code')?.value;
                          labels.push(typeof brokerCode === 'string' && Object.hasOwn(fixed, brokerCode) ? fixed[brokerCode]!
                            : typeof message === 'string' && Object.hasOwn(fixed, message) ? fixed[message]!
                            : typeof code === 'string' && /^(RECOVERY_REQUIRED|LEASE_FENCED|REVISION_CONFLICT|ERR_CLIQ_RESOURCE_RETIREMENT)$/u.test(code) ? code.toLowerCase()
                            : candidate instanceof TypeError ? 'type' : 'other');
                          candidate = Object.getOwnPropertyDescriptor(candidate, 'cause')?.value;
                        }
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_' + diagnosticStep + (labels.length ? '__' + labels.join('__') : '') + '\\n');
                      } catch {}
                    };'''.replace('__LABELS__', json.dumps(labels)), 1)
          steps = [
           ("            const received = await actual.result();", "            const received = await actual.result().catch(error => { diagnostic('stdio_result_refused', error); throw error; });\n            diagnostic('stdio_result_' + received.kind);"),
           ("                if (!settled) { await uncertain.finish(); settled = true; }",
            "                if (!settled) { diagnostic('stdio_unknown_settlement'); await uncertain.finish().catch(error => { diagnostic('stdio_unknown_refused', error); throw error; }); settled = true; diagnostic('stdio_unknown_settled'); }"),
           ("              const custody = readMcpRunResourceOwner(native, binding);",
            "              diagnostic('http_protocol_refused', error);\n              const custody = readMcpRunResourceOwner(native, binding);\n              diagnostic(custody.joined ? 'http_joined' : 'http_join_missing');"),
           ("                      else settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)).run;",
            "                      else {\n                        diagnostic('http_unknown_settlement');\n                        settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)\n                          .catch(error => { diagnostic('http_unknown_refused', error); throw error; })).run;\n                        diagnostic('http_unknown_settled');\n                      }"),
          ]
          for old, new in steps:
              assert body.count(old) == 1, old
              body = body.replace(old, new)
          p.write_text(s[:start] + body + s[end:])
          PY
      - run: npm run build
      - name: Check the actual installed campaign import closure
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --esModuleInterop --jsx react-jsx
          scripts/kernel/testing/postject.d.ts
          scripts/kernel/qualify-installed-mcp-recovery-journey.ts
      - name: Check original status, retry and complete Session data contracts
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/kernel/mcp-status.test.ts
          src/state/mcp-status-proof.test.ts
          src/state/mcp-recovery-admission.test.ts
          src/state/mcp-status-projection.test.ts
          src/state/reconciliation-capacity.test.ts
          scripts/kernel/testing/installed-session-segments.test.ts
          scripts/kernel/testing/installed-mcp-retry-http.test.ts
      - name: Install original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual C recipe and natural lost responses
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-stdio-native-data.test.ts
      - name: Exercise the complete signed installation and original v1 entry
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
