name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-supervisor-preflight:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-native' && inputs.expected_revision == '78f8c9314f399b412e2033029b03c150527a4ca8' }}
    name: Linux Supervisor image and actual user-manager diagnostics
    # Component/OS facts only, not an installed I1 qualification. Standard
    # public-repository runner; never substitute a detached child manager.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
        id: build
      - name: Install actual platform and worker build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build strace libext2fs-dev pkg-config
      # These independent disposable fixtures must not spend the stateful
      # credential journey's unchanged budget. Keep their exact assertions
      # on the same qualified OS/Node baseline; no authority crosses jobs.
      - name: Bound the genuine native credential queue and connection retirement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/credential-platform-queue.test.ts
          scripts/kernel/testing/credential-platform-timeout.test.ts
          scripts/kernel/testing/model-broker-preparation-lifecycle.test.ts
      - name: Verify the bounded secret scan before collecting credential artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --test --import tsx
          scripts/kernel/testing/credential-secret-scan.test.ts
          scripts/kernel/testing/credential-secret-corpus.test.ts
      - name: Reject unsupported credential schemas through the signed entry
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --test --import tsx scripts/kernel/testing/credential-authority-journey.test.ts
      - name: Verify installed-state and native-retirement boundaries on Linux 22.04
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # These component tests also run in the 24.04 matrix. Keep the real
        # installed/native boundary on the qualified 22.04 baseline too;
        # they do not substitute for the systemd installed execution chain.
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/state/installed-runtime.test.ts
          src/state/installed-genesis.test.ts
          src/state/installed-native-loader.test.ts
          src/state/installed-genesis-boundaries.test.ts
          src/state/genesis-schema-boundaries.test.ts
          src/state/supervisor-observation.test.ts
          src/state/installed-control.test.ts
          src/state/installed-control-client.test.ts
          src/sandbox/native-controller-close.test.ts
          scripts/kernel/sqlite-extension-headers.test.ts
          scripts/kernel/testing/installed-read-control.test.ts
          scripts/kernel/qualify-sqlite-paths.test.ts
          scripts/kernel/testing/sqlite-vfs-mechanism.test.ts
          scripts/kernel/testing/credential-vfs-probe.test.ts
          scripts/kernel/testing/credential-vfs-lock.test.ts
          scripts/kernel/testing/credential-vfs-crash.test.ts
          scripts/kernel/testing/credential-vfs-retirement.test.ts
          scripts/kernel/testing/credential-vfs-storage.test.ts
          scripts/kernel/testing/credential-authority-bridge.test.ts
          scripts/kernel/testing/credential-authority-installed.test.ts
          scripts/kernel/testing/endpoint-authority-installed.test.ts
          scripts/kernel/testing/endpoint-authority-journey.test.ts
          scripts/kernel/testing/endpoint-wal-proof.test.ts
          scripts/kernel/testing/endpoint-authority-crash.test.ts
      - name: Qualify complete application image binding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx scripts/kernel/qualify-supervisor-image.ts "$RUNNER_TEMP/cliq-supervisor-image"
      - name: Measure fixed carrier metadata reduction without selecting it
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node --import tsx scripts/kernel/qualify-supervisor-carrier-size.ts
          "$RUNNER_TEMP/cliq-supervisor-carrier-size"
          "$RUNNER_TEMP/cliq-supervisor-image/node-v24.21.0-linux-x64.tar.xz"
      - name: Retain bounded carrier experiment metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-carrier-size-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-supervisor-carrier-size/carrier-size-experiment.json
          if-no-files-found: warn
          retention-days: 7
      - name: Observe real systemd-user delegation and restart identities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          node --test scripts/kernel/testing/systemd-process-fact.test.mjs
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh "$probe_node" "$RUNNER_TEMP/cliq-systemd-user"
      - name: Qualify actual installed SEA closed-role and missing-keeper refusals
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx scripts/kernel/qualify-installed-startup.ts "$RUNNER_TEMP/cliq-installed-startup"
      - name: Qualify signed keeper handoff, genesis and Supervisor restart under the user manager
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --installed "$probe_node" "$RUNNER_TEMP/cliq-installed-keeper"
      - name: Observe real credential platform and SQLite path prerequisites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --secrets "$probe_node" "$RUNNER_TEMP/cliq-secret-service"
      - name: Reject unresolved installed preactivation before publishing the Store
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --installed-retirement-refusal "$probe_node" "$RUNNER_TEMP/cliq-installed-retirement"
      - name: Retain bounded component and lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-supervisor-image/report.json
            ${{ runner.temp }}/cliq-systemd-user/*.json
            ${{ runner.temp }}/cliq-installed-startup/report.json
            ${{ runner.temp }}/cliq-installed-keeper/*.json
            ${{ runner.temp }}/cliq-secret-service/*.json
            ${{ runner.temp }}/cliq-installed-retirement/*.json
            ${{ runner.temp }}/cliq-endpoint-crash-*/**
          if-no-files-found: warn
          retention-days: 7

  linux-run-execution:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-native' && inputs.expected_revision == '78f8c9314f399b412e2033029b03c150527a4ca8' }}
    name: Real Linux Run execution and recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap libcap-dev libselinux1-dev meson ninja-build musl-tools e2fsprogs libext2fs-dev pkg-config
      - name: Verify real worker seccomp ABI and syscall denials
        shell: bash
        run: |
          node --test --import tsx scripts/kernel/testing/guest-verifier-process.test.ts scripts/kernel/testing/guest-verifier-diagnostics.test.ts
          node --test scripts/kernel/testing/build-bubblewrap.test.mjs
          storage_regression="$RUNNER_TEMP/cliq-source-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          musl-gcc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -idirafter /usr/include -idirafter "/usr/include/$(musl-gcc -dumpmachine)" \
            native/linux/source-storage.test.c -o "$storage_regression"
          "$storage_regression"
          regression="$RUNNER_TEMP/cliq-worker-seccomp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          channel_regression="$RUNNER_TEMP/cliq-worker-channel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hash_regression="$RUNNER_TEMP/cliq-worker-sha256-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          musl-gcc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -idirafter /usr/include -idirafter "/usr/include/$(musl-gcc -dumpmachine)" \
            native/linux/worker-channel.test.c -o "$channel_regression"
          "$channel_regression"
          musl-gcc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -idirafter /usr/include -idirafter "/usr/include/$(musl-gcc -dumpmachine)" \
            native/linux/worker-seccomp.test.c -o "$regression"
          "$regression"
          musl-gcc -std=c11 -O2 -Wall -Wextra -Werror -static \
            -idirafter /usr/include -idirafter "/usr/include/$(musl-gcc -dumpmachine)" \
            native/linux/worker-sha256.test.c -o "$hash_regression"
          "$hash_regression"
      - name: Build real execution images
        id: images
        shell: bash
        run: |
          installation="$RUNNER_TEMP/cliq-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/kernel/build-linux-worker.mjs "$installation"
          printf 'installation=%s\n' "$installation" >> "$GITHUB_OUTPUT"
          foreign_installation="${installation}-foreign-owner"
          mkdir -m 0700 "$foreign_installation"
          printf 'foreign_installation=%s\n' "$foreign_installation" >> "$GITHUB_OUTPUT"
          for image in linux-worker.node cliq-linux-worker-controller cliq-linux-worker cliq-linux-edit cliq-linux-bubblewrap; do
            cp -- "$installation/$image" "$foreign_installation/$image"
          done
          chmod 0555 "$foreign_installation/linux-worker.node"
          sudo chown 65534:65534 "$foreign_installation/linux-worker.node"
      - name: Create disposable persistent state volume and delegated cgroup
        id: fixture
        shell: bash
        run: |
          parent="/sys/fs/cgroup/cliq-i1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'parent=%s\n' "$parent" >> "$GITHUB_OUTPUT"
          sudo mkdir "$parent"
          for controller in cpu memory pids; do
            grep -qw "$controller" "$parent/cgroup.controllers"
          done
          printf '+cpu +memory +pids\n' | sudo tee "$parent/cgroup.subtree_control" >/dev/null
          sudo mkdir "$parent/supervisor"
          sudo chown "$(id -u):$(id -g)" "$parent"
          while IFS= read -r delegated_file; do
            [ -e "$parent/$delegated_file" ] || continue
            sudo chown "$(id -u):$(id -g)" "$parent/$delegated_file"
          done < /sys/kernel/cgroup/delegate
          sudo chmod 0700 "$parent"
          volume="$RUNNER_TEMP/cliq-i1-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="$RUNNER_TEMP/cliq-i1-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ext4"
          printf 'volume=%s\nimage=%s\n' "$volume" "$image" >> "$GITHUB_OUTPUT"
          mkdir -m 0700 "$volume"
          truncate -s 128M "$image"
          mkfs.ext4 -q -F "$image"
          sudo mount -o loop,nodev,nosuid,noexec "$image" "$volume"
          sudo chown "$(id -u):$(id -g)" "$volume"
          sudo chmod 0700 "$volume"
          uname -a
          bwrap --version
          stat -f -c 'state-volume-type=%T capacity-blocks=%b block-size=%S' "$volume"
      - name: Reject a readable foreign-owned signed native installation
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_FOREIGN_INSTALLATION: ${{ steps.images.outputs.foreign_installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
        run: node --import tsx scripts/kernel/check-linux-worker-installation.ts "$CLIQ_I1_INSTALLATION" "$CLIQ_I1_FOREIGN_INSTALLATION" "$CLIQ_I1_CGROUP_PARENT"
      - name: Observe the actual first controller fork in its protected anchor
        # Test-only independent root tracer; offline campaign prefix, not the
        # installed signed Supervisor I1 or a durable worker death witness.
        # Stay outside the disposable cgroup and move only the owned child.
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_STATE_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          node_path=$(realpath "$(command -v node)")
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT,CLIQ_I1_STATE_VOLUME \
            "$node_path" scripts/kernel/qualify-controller-anchor-birth.mjs
      - name: Refuse failed retirement of the exact real controller leaf
        id: leaf_retirement
        # Test-only syscall-result interposer; genuine controller HELLO and
        # exact child join, not installed I1 or whole-worker death evidence.
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          node_path=$(command -v node)
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NODE_PATH="$node_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_I1_CGROUP_PARENT/supervisor/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NODE_PATH" scripts/kernel/testing/controller-leaf-retirement.mjs
            '
      - name: Exercise actual StateStore and native lifecycle
        # Keep the independent image/StateStore regression observable even
        # when the preceding leaf-retirement regression demonstrates a bug.
        if: ${{ !cancelled() && (success() || steps.leaf_retirement.outcome == 'failure') }}
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_STATE_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          node_path=$(command -v node)
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_CGROUP_PARENT,CLIQ_I1_STATE_VOLUME \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NODE_PATH="$node_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_I1_CGROUP_PARENT/supervisor/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NODE_PATH" --import tsx scripts/kernel/run-linux-worker-campaign.ts
            '
      - name: Build the actual same-image guest toolchain and separate CAS fixture
        id: guest
        # Preserve all original native scenarios and their 128 MiB capacity
        # oracle. Only this independent StateRoot fixture uses a larger volume;
        # the raw guest ext4 itself is never mounted, loop-attached or sudo-run.
        if: ${{ !cancelled() && steps.images.outcome == 'success' && steps.fixture.outcome == 'success' }}
        shell: bash
        run: |
          guest_root="$RUNNER_TEMP/cliq-guest-toolchain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          carrier_root="$RUNNER_TEMP/cliq-guest-carrier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report_root="$RUNNER_TEMP/cliq-guest-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'guest_root=%s\nreport_root=%s\n' "$guest_root" "$report_root" >> "$GITHUB_OUTPUT"
          node --import tsx scripts/kernel/run-linux-guest-verifier-campaign.ts --prepare \
            "$guest_root" '${{ steps.images.outputs.installation }}' "$carrier_root"
          guest_state_volume="$RUNNER_TEMP/cliq-i1-guest-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          guest_state_image="$RUNNER_TEMP/cliq-i1-guest-volume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ext4"
          printf 'state_volume=%s\n' "$guest_state_volume" >> "$GITHUB_OUTPUT"
          mkdir -m 0700 "$guest_state_volume"
          truncate -s 512M "$guest_state_image"
          mkfs.ext4 -q -F "$guest_state_image"
          sudo mount -o loop,nodev,nosuid,noexec "$guest_state_image" "$guest_state_volume"
          sudo chown "$(id -u):$(id -g)" "$guest_state_volume"
          sudo chmod 0700 "$guest_state_volume"
      - name: Exercise real signed guest extraction and required Node verifier lifecycle
        if: ${{ !cancelled() && steps.guest.outcome == 'success' }}
        env:
          CLIQ_I1_INSTALLATION: ${{ steps.images.outputs.installation }}
          CLIQ_I1_GUEST_IMAGE: ${{ steps.guest.outputs.guest_root }}
          CLIQ_I1_GUEST_STATE_VOLUME: ${{ steps.guest.outputs.state_volume }}
          CLIQ_I1_CGROUP_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_GUEST_REPORT_ROOT: ${{ steps.guest.outputs.report_root }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          runner_home=$HOME
          runner_path=$PATH
          node_path=$(command -v node)
          sudo --preserve-env=CLIQ_I1_INSTALLATION,CLIQ_I1_GUEST_IMAGE,CLIQ_I1_GUEST_STATE_VOLUME,CLIQ_I1_CGROUP_PARENT,CLIQ_GUEST_REPORT_ROOT \
            env CLIQ_RUNNER_UID="$runner_uid" CLIQ_RUNNER_GID="$runner_gid" \
              CLIQ_RUNNER_HOME="$runner_home" CLIQ_RUNNER_PATH="$runner_path" CLIQ_NODE_PATH="$node_path" \
            /bin/bash -c '
              printf "%s\n" "$$" > "$CLIQ_I1_CGROUP_PARENT/supervisor/cgroup.procs"
              exec /usr/bin/setpriv --reuid="$CLIQ_RUNNER_UID" --regid="$CLIQ_RUNNER_GID" --clear-groups \
                /usr/bin/env HOME="$CLIQ_RUNNER_HOME" PATH="$CLIQ_RUNNER_PATH" \
                "$CLIQ_NODE_PATH" --import tsx scripts/kernel/run-linux-guest-verifier-campaign.ts --run "$CLIQ_GUEST_REPORT_ROOT"
            '
      - name: Retire disposable execution resources
        if: always() && steps.fixture.outputs.parent != ''
        env:
          CLIQ_I1_PARENT: ${{ steps.fixture.outputs.parent }}
          CLIQ_I1_VOLUME: ${{ steps.fixture.outputs.volume }}
        shell: bash
        run: |
          if [ -d "$CLIQ_I1_PARENT" ]; then
            printf '1\n' | sudo tee "$CLIQ_I1_PARENT/cgroup.kill" >/dev/null
            for attempt in {1..100}; do
              grep -q '^populated 0$' "$CLIQ_I1_PARENT/cgroup.events" && break
              sleep 0.05
            done
            grep -q '^populated 0$' "$CLIQ_I1_PARENT/cgroup.events"
            while IFS= read -r -d '' child; do sudo rmdir "$child"; done < <(find "$CLIQ_I1_PARENT" -mindepth 1 -depth -type d -print0)
            sudo rmdir "$CLIQ_I1_PARENT"
          fi
          if [ -n "$CLIQ_I1_VOLUME" ] && mountpoint -q "$CLIQ_I1_VOLUME"; then sudo umount "$CLIQ_I1_VOLUME"; fi
      - name: Retire the independent guest StateRoot fixture
        if: always() && steps.guest.outputs.state_volume != ''
        env:
          CLIQ_I1_GUEST_VOLUME: ${{ steps.guest.outputs.state_volume }}
        shell: bash
        run: |
          if mountpoint -q "$CLIQ_I1_GUEST_VOLUME"; then sudo umount "$CLIQ_I1_GUEST_VOLUME"; fi
          if mountpoint -q "$CLIQ_I1_GUEST_VOLUME"; then exit 1; fi
      - name: Retain only bounded guest verifier feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-guest-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.guest.outputs.report_root }}/guest-extractor-report.json
            ${{ steps.guest.outputs.report_root }}/guest-preparing-git-report.json
            ${{ steps.guest.outputs.report_root }}/guest-verifier-report.json
            ${{ steps.guest.outputs.report_root }}/guest-campaign-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove the independent ownership regression installation
        if: always() && steps.images.outputs.foreign_installation != ''
        env:
          CLIQ_I1_FOREIGN_INSTALLATION: ${{ steps.images.outputs.foreign_installation }}
        shell: bash
        run: |
          for image in linux-worker.node cliq-linux-worker-controller cliq-linux-worker cliq-linux-edit cliq-linux-bubblewrap; do
            rm -f -- "$CLIQ_I1_FOREIGN_INSTALLATION/$image"
          done
          rmdir -- "$CLIQ_I1_FOREIGN_INSTALLATION"

  linux-installed-verifier:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-native' && inputs.expected_revision == '78f8c9314f399b412e2033029b03c150527a4ca8' }}
    name: Linux signed installed required and advisory Node verifier
    # Standard public-repository runner. Its own full installation/corpus and
    # 20-minute budget do not replace or dilute any original campaign.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-run-client.test.mjs scripts/kernel/testing/installed-client-journey.test.mjs scripts/kernel/testing/installed-status-regression.test.mjs
      - run: node --test --import tsx scripts/kernel/guest-image-layout.test.mjs scripts/kernel/testing/installed-guest-package.test.ts scripts/kernel/testing/installed-client-consumer.test.ts scripts/kernel/testing/installed-control-client-driver.test.ts scripts/kernel/testing/installed-enroll-diagnostic.test.ts
      - run: npm run build
        id: build
      - name: Install actual guest, transport and Secret Service prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check the actual native dependency family before installed qualification
        run: |
          node --test --test-concurrency=1 --import tsx scripts/kernel/testing/dependency-native-family.test.ts scripts/kernel/testing/dependency-broker-lifecycle.test.ts scripts/kernel/testing/dependency-npm-stage.test.ts scripts/kernel/testing/preparing-git-native.test.ts scripts/kernel/testing/installed-genesis.test.ts
          node --test --test-concurrency=1 --import tsx src/sandbox/sealed-images.test.ts src/sandbox/builtin-tool-native.test.ts
          if ! git cat-file -e 'ba804a59dcadee80cb41c822e2d0e32198462f20^{commit}'; then
            git fetch --no-tags --depth=1 origin ba804a59dcadee80cb41c822e2d0e32198462f20
          fi
          node --import tsx scripts/kernel/testing/qualify-native-callback-lifecycle.ts "$RUNNER_TEMP/cliq-native-callback-lifecycle"
      - name: Acquire the exact official npm qualification source
        id: npm_source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { constants } from 'node:fs';
          import { open } from 'node:fs/promises';
          import path from 'node:path';
          import { NPM_DATA_RECIPE } from './src/sandbox/npm-data-image.ts';
          import { buildInstalledNpmDataAsset } from './scripts/kernel/testing/installed-npm-package.ts';
          assert(typeof process.env.RUNNER_TEMP === 'string' && path.isAbsolute(process.env.RUNNER_TEMP));
          const response = await fetch(NPM_DATA_RECIPE.officialArchive, {
            redirect: 'error', signal: AbortSignal.timeout(60000)
          });
          const chunks = []; let total = 0;
          try {
            assert.equal(response.status, 200); assert(response.body);
            for await (const chunk of response.body) {
              total += chunk.byteLength; assert(total <= NPM_DATA_RECIPE.archiveBytes);
              chunks.push(Buffer.from(chunk));
            }
          } finally { await response.body?.cancel(); }
          assert.equal(total, NPM_DATA_RECIPE.archiveBytes);
          const archive = Buffer.concat(chunks, total);
          buildInstalledNpmDataAsset(archive);
          const file = await open(path.join(process.env.RUNNER_TEMP, 'cliq-official-npm-10.9.2.tgz'),
            constants.O_WRONLY | constants.O_CREAT | constants.O_EXCL | constants.O_NOFOLLOW, 0o600);
          try { await file.writeFile(archive); await file.sync(); } finally { await file.close(); }
          NODE
      - name: Observe the fixed original installed status deadlock
        shell: bash
        run: |
          if ! git cat-file -e 'b6140b57836e19b0fb937327af449e8138f47eca^{commit}'; then
            git fetch --no-tags --depth=1 origin b6140b57836e19b0fb937327af449e8138f47eca
          fi
          mkdir -m 700 "$RUNNER_TEMP/cliq-installed-status-regression"
          node scripts/kernel/testing/installed-status-regression.mjs "$RUNNER_TEMP/cliq-installed-status-regression/status-borrow-regression.json"
      - name: Exercise signed installed identity grant, Node verifier, repair and terminal replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.npm_source.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          probe_npm_archive="$RUNNER_TEMP/cliq-official-npm-10.9.2.tgz"
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-verifier-journey --locked-node "$probe_npm_archive" "$probe_node" "$RUNNER_TEMP/cliq-installed-verifier-journey"
      - name: Retain only bounded installed verifier and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-verifier-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-verifier-journey/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain only the closed original status regression observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-status-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-status-regression/status-borrow-regression.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain only bounded native callback receipts and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-callback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-native-callback-lifecycle/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain bounded native callback source and joined output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-callback-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.json
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.tap
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.stderr
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.source.tar
            ${{ runner.temp }}/cliq-native-callback-lifecycle/carrier/*.tar.xz
          if-no-files-found: warn
          retention-days: 7

