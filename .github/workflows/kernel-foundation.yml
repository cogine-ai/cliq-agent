name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-http-manual-checkpoint' && inputs.expected_revision == '3a7350cd28346f3892653dd5c6d7f37a7af5e4f2' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Observe only the original test-owned HTTP ambiguity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-mcp-journey.ts')
          s = p.read_text()
          needle = '  for (const kind of INSTALLED_MCP_CASES) {'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + "\n    if (kind !== 'unknown_after_effect') continue;")
          needle = '    let cut: Data;'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n    let lastState: string | undefined;')
          needle = '      assert(Date.now() < by, \'the observed MCP result arrived after the original 90-second window\');'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                const run = cut.snapshot.run;
                const row = cut.journal.filter((entry: Data) => entry.opKind === 'mcp').at(-1);
                const state = [run.status, run.waitingReason ?? 'none', row?.phase ?? 'none'].join('_');
                if (state !== lastState && /^[a-z_]{1,100}$/u.test(state)) { lastState = state; context.mark('http_ambiguity_' + state); }
          ''')
          needle = '        if (wait.subject?.kind !== \'worker_death\') { decodeManualInvocationWait(wait); break; }'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                  const phase = wait.probeState?.phase, count = wait.probeState?.automaticProbeCount;
                  if (['automatic_pending','automatic_in_flight','automatic_exhausted'].includes(phase) && Number.isSafeInteger(count) && count >= 0 && count <= 8) {
                    const key = 'worker_death_' + phase + '_' + count;
                    if (key !== lastWorker) { lastWorker = key; context.mark('http_ambiguity_' + key); }
                  }
          ''').replace('    let lastState: string | undefined;', '    let lastState: string | undefined, lastWorker: string | undefined;')
          p.write_text(s)
          labels = {}
          for name in ('store', 'run-execution', 'worker-recovery', 'recovery-closure', 'mcp-execution', 'manual-reconciliation', 'worker-preparation',
            'reducers/worker-recovery', 'reducers/invocation', 'sqlite-driver', 'retained-generation', 'worker-stop'):
              path = Path('src/state/' + name + '.ts')
              if path.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{8,150})'", path.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for msg, label in list(labels.items()):
              labels[msg + ' differs from retained authority'] = label + '_different'
          p = Path('src/state/store.ts')
          s = p.read_text()
          needle = '        this.installedRunFailures.set(runId, error);\n        diagnosis?.failure(error, this.closeRequested);'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                  try {
                    const safe: Record<string,string> = __LABELS__;
                    const labels: string[] = []; let item: unknown = error;
                    for (let i = 0; i < 5 && item instanceof Error; i++) {
                      const msg = Object.getOwnPropertyDescriptor(item, 'message')?.value;
                      const code = Object.getOwnPropertyDescriptor(item, 'code')?.value;
                      labels.push(typeof msg === 'string' && Object.hasOwn(safe, msg) ? safe[msg]!
                        : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|REVISION_CONFLICT|LEASE_FENCED|STATE_TRANSITION_INVALID|ERR_NODE_SQLITE_ERROR)$/u.test(code)
                          ? code.toLowerCase() : item instanceof TypeError ? 'type' : 'other');
                      item = Object.getOwnPropertyDescriptor(item, 'cause')?.value;
                    }
                    if (labels.length) process.stderr.write('CLIQ_PR536_HTTP_RECOVERY_' + labels.join('__') + '\\n');
                  } catch {}
          '''.replace('__LABELS__', json.dumps(labels)))
          p.write_text(s)
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          trap 'sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat --grep "^CLIQ_PR536_HTTP_RECOVERY_" | /bin/grep -E "^CLIQ_PR536_HTTP_RECOVERY_[a-z0-9_]{1,650}$" | sort | uniq -c | head -30 || true' EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

