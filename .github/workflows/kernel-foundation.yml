name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-prepare' && inputs.expected_revision == '81a9f8d0a1f4734f916d520b6ff9db4b739b9e5b' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add fixed diagnostic-only MCP prepare marks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/mcp-registration.ts')
          s = p.read_text()
          original = '''        openInstalledMcpHttpAdminScope(selected, anchor, controller, owner.filesystem, physicalInput!, inputBinding, launch.toolchain, config, { signal }));'''
          observed = '''        openInstalledMcpHttpAdminScope(selected, anchor, controller, owner.filesystem, physicalInput!, inputBinding, launch.toolchain, config, { signal }).catch(error => {
                    const message = error instanceof Error ? Object.getOwnPropertyDescriptor(error, 'message')?.value : undefined;
                    const label = message === 'Admin MCP requires original physical input and exact signed fixed images' ? 'reservation_input'
                      : message === 'Admin MCP fixed recipe receiver unavailable' ? 'reservation_recipe'
                      : message === 'Admin MCP original reservation dispatch is uncertain' ? 'reservation_dispatch'
                      : message === 'Admin MCP owning receiver could not be retained' ? 'reservation_receiver'
                      : message === 'Admin MCP original input already consumed' ? 'reservation_consumed'
                      : 'unclassified';
                    try { process.stderr.write('CLIQ_PR536_MCP_PREPARE_' + label + '\\n'); } catch {}
                    throw error;
                  }));'''
          assert s.count(original) == 1
          p.write_text(s.replace(original, observed))
          p = Path('src/sandbox/mcp-http-admin-native.ts')
          s = p.read_text()
          steps = [
              ('    script = await sealInstalledMcpAdminProbe(selected, options.signal);', 'seal_start'),
              ('    guest = await startInstalledGuestToolchain(selected, toolchain, options);', 'guest_start'),
              ('    original = reserveInstalledMcpHttpAdmin(controller, nativeInput, guest, script, Buffer.from(configBytes));', 'reserve_start'),
          ]
          for code, name in steps:
              assert s.count(code) == 1
              s = s.replace(code, "    try { process.stderr.write('CLIQ_PR536_MCP_PREPARE_" + name + "\\n'); } catch {}\n" + code)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_mcp_prepare_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_MCP_PREPARE_' |
              /bin/grep -E '^CLIQ_PR536_MCP_PREPARE_(seal_start|guest_start|reserve_start|reservation_input|reservation_recipe|reservation_dispatch|reservation_receiver|reservation_consumed|unclassified)$' |
              head -60 || true
          }
          trap report_mcp_prepare_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

