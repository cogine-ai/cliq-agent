name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-permission:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-permission-cut' && inputs.expected_revision == '81a4dbd8a3679e7b4e16fec9ab2cfef801bf4f20' }}
    name: Linux signed installed verifier and Delivery permissions
    # A separate standard free runner preserves every original campaign.
    # This owned HTTPS fixture cannot qualify a paid provider or real TTY.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add fixed non-authoritative permission cut timings to the disposable fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-permission-journey.ts')
          s = p.read_text()
          base = '    let cut: Data, denial: { frame: Data; response: Response } | undefined;'
          definition = '''    let observed = 0, readTime = 0, lastRevision: number | undefined;
              function notePermissionCut(point: 'read' | 'approval_begin' | 'approval_done', run: Data) {
                try {
                  const state = ['queued', 'running', 'waiting', 'succeeded', 'completed_unverified', 'failed', 'cancelled'].includes(run.status)
                    ? run.status : 'other';
                  const nextStep = ['agent', 'tool', 'verify', 'delivery', 'finalize'].includes(run.nextStep) ? run.nextStep : 'other';
                  const waiting = ['approval', 'input', 'reconciliation'].includes(run.waitingReason) ? run.waitingReason : 'other';
                  const elapsedMs = Math.max(0, Date.now() - (by - 90000));
                  console.error('CLIQ_PR536_PERMISSION ' + JSON.stringify({kind, point, state, nextStep, waiting,
                    revision: Number.isSafeInteger(run.revision) ? run.revision : null, elapsedMs, observed, readTime,
                    posts: context.responder.posts(kind), approvals, edits, workerFreeWaits, restarted}));
                } catch { /* Fixed data diagnosis never alters the real assertion. */ }
              }
          '''
          assert s.count(base) == 1
          s = s.replace(base, definition + base)
          start = '      cut = await get(admitted.id); const run = cut.snapshot.run;'
          assert s.count(start) == 1
          s = s.replace(start, '''      const startedRead = Date.now();
          ''' + start + '''
                observed++; readTime += Date.now() - startedRead;
                if (run.revision !== lastRevision || Date.now() >= by) {
                  lastRevision = run.revision; notePermissionCut('read', run);
                }
          ''')
          pre = '          seen.add(run.waitingOnRef); workerFreeWaits++;'
          assert s.count(pre) == 1
          s = s.replace(pre, pre + "\n          notePermissionCut('approval_begin', run);")
          post = "      assert(Date.now() < by, 'ordinary permission case exceeded the original 90-second source window');"
          assert s.count(post) == 1
          s = s.replace(post, "      if (Date.now() >= by) notePermissionCut('approval_done', run);\n" + post)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Check the closed report and owned model responder
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-permission-result.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise exact approvals, repair, refusal, templates and Delivery
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-permission-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-permission-journey"
      - name: Retain bounded permission and original cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-permission-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-permission-journey/*.json
          if-no-files-found: warn
          retention-days: 7

