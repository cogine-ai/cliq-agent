name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery-delayed-volume:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-delayed-stop-phase' && inputs.expected_revision == 'ebe79a7244e69e872cae55841daa91709f9b04eb' }}
    name: Linux installed Delivery on owned delayed storage
    # A separate free standard disposable VM, not a host/global-disk fixture.
    # This retains the ordinary complete Delivery assertions. Fixed timing
    # diagnostics do not qualify a late result or an in-flight stop by themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Mark the exact model-release phase in the existing signed Stop diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stages = ['connect_read', 'connect_io', 'body_read', 'body_io', 'body_returned']
          store = Path('src/state/store.ts')
          source = store.read_text()
          tail = "'drive_model_claim' | 'drive_model_release'>();"
          assert source.count(tail) == 1
          source = source.replace(tail, tail.replace('>();', ''.join(" | 'drive_model_" + stage + "'" for stage in stages) + '>();'))
          original_gate = '        const gate = async <T>(release: () => Promise<T>): Promise<T> => {'
          assert source.count(original_gate) == 1
          source = source.replace(original_gate, """        const gate = async <T>(phase: 'connect' | 'body', release: () => Promise<T>): Promise<T> => {
                    this.installedRunPhases.set(runId, phase === 'connect' ? 'drive_model_connect_read' : 'drive_model_body_read');""")
          start = source.index("        const gate = async <T>(phase: 'connect'")
          end = source.index('        receivedResponse = true;', start)
          section = source[start:end]
          for before, after in [
            ('          return release();', """          this.installedRunPhases.set(runId, phase === 'connect' ? 'drive_model_connect_io' : 'drive_model_body_io');
                    return release();"""),
            ('await gate(() => transport!.connect(binding))', "await gate('connect', () => transport!.connect(binding))"),
            ('await gate(() => transport!.releaseBody(binding));', """await gate('body', () => transport!.releaseBody(binding));
                  this.installedRunPhases.set(runId, 'drive_model_body_returned');"""),
          ]:
              assert section.count(before) == 1
              section = section.replace(before, after)
          store.write_text(source[:start] + section + source[end:])

          diagnostics = Path('src/state/installed-run-diagnostics.ts')
          source = diagnostics.read_text()
          anchor = "'drive_credential_prepare', 'drive_model_claim', 'drive_model_release',"
          assert source.count(anchor) == 1
          diagnostics.write_text(source.replace(anchor, anchor + '\n  ' + ', '.join("'drive_model_" + stage + "'" for stage in stages) + ','))
          PY
      - run: npm run build
        id: build
      - name: Install actual guest, Secret Service and owned-volume prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config dmsetup kmod
      - name: Require the disposable hosted VM and its actual fixed delay target
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          if [[ ! -d /sys/module/dm_delay ]]; then sudo /usr/sbin/modprobe dm_delay; fi
          sudo /usr/bin/udevadm settle --timeout=5
          test -d /sys/module/dm_mod
          test -d /sys/module/dm_delay
          test -c /dev/mapper/control
      - name: Exercise the unchanged installed Delivery closure on the unique owned delayed volume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --delay-volume --run-delivery-delay-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-delayed-volume"
      - name: Retain only bounded reports and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-delayed-volume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-delayed-volume/*.json
          if-no-files-found: warn
          retention-days: 7

