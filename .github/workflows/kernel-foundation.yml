name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp-recovery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-stdio-critical' && inputs.expected_revision == '3a7350cd28346f3892653dd5c6d7f37a7af5e4f2' }}
    name: Linux signed MCP status, retry and owning shutdown
    # Public repository: standard free runner, with the original production
    # build, lifecycle, billing and deadline assertions left intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Record only closed original MCP ambiguity phase labels
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          paths = ('src/state/run-execution.ts', 'src/state/mcp-execution.ts', 'src/state/mcp-stdio-unknown.ts',
              'src/state/mcp-stdio-run.ts', 'src/state/worker-recovery.ts', 'src/state/reducers/invocation.ts',
              'src/state/installed-runtime.ts', 'src/state/repositories/journal.ts', 'src/kernel/broker-ambiguity.ts',
              'src/sandbox/mcp-stdio-native.ts', 'src/state/mcp-stdio-protocol.ts', 'src/state/mcp-stdio-launch.ts',
              'src/state/mcp-server-lifecycle.ts', 'src/state/mcp-server-retirement.ts', 'src/state/sqlite-driver.ts')
          labels = {}
          for p in paths:
              path = Path(p)
              if path.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,150})'", path.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for path in Path('native/linux').glob('*mcp*.h'):
              for msg in re.findall(r'"(mcp_[a-z0-9_]{2,80})"', path.read_text()):
                  labels[msg] = msg

          p = Path('src/state/run-execution.ts')
          s = p.read_text()
          start = s.index("        if (prepared.target.execution.kind === 'mcp') {", s.index('const currentWorker = worker;'))
          end = s.index("        builtinPhase('tool_claim_spec');", start)
          body = s[start:end]
          body = body.replace("        if (prepared.target.execution.kind === 'mcp') {", '''        if (prepared.target.execution.kind === 'mcp') {
                    let diagnosticStep = 'enter';
                    const diagnostic = (step: string, error?: unknown) => {
                      try {
                        diagnosticStep = step;
                        const fixed: Record<string, string> = __LABELS__;
                        const labels: string[] = [];
                        let candidate = error;
                        for (let i = 0; i < 4 && candidate instanceof Error; i++) {
                          const message = Object.getOwnPropertyDescriptor(candidate, 'message')?.value;
                          const brokerCode = Object.getOwnPropertyDescriptor(candidate, 'brokerCode')?.value;
                          const code = Object.getOwnPropertyDescriptor(candidate, 'code')?.value;
                          labels.push(typeof brokerCode === 'string' && Object.hasOwn(fixed, brokerCode) ? fixed[brokerCode]!
                            : typeof message === 'string' && Object.hasOwn(fixed, message) ? fixed[message]!
                            : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|LEASE_FENCED|REVISION_CONFLICT|ERR_CLIQ_RESOURCE_RETIREMENT|ERR_CLIQ_MCP_STDIO|ERR_CLIQ_STATE_OWNER_NATIVE|ERR_SQLITE_ERROR|ENOENT|EACCES)$/u.test(code) ? code.toLowerCase()
                            : candidate instanceof TypeError ? 'type' : 'other');
                          candidate = Object.getOwnPropertyDescriptor(candidate, 'cause')?.value;
                        }
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_' + diagnosticStep + (labels.length ? '__' + labels.join('__') : '') + '\\n');
                      } catch {}
                    };'''.replace('__LABELS__', json.dumps(labels)), 1)
          steps = [
           ("            const received = await actual.result();", "            const received = await actual.result().catch(error => { diagnostic('stdio_result_refused', error); throw error; });\n            diagnostic('stdio_result_' + received.kind, received.failure);"),
           ("                if (!settled) { await uncertain.finish(); settled = true; }",
            "                if (!settled) { diagnostic('stdio_unknown_settlement'); await uncertain.finish().catch(error => { diagnostic('stdio_unknown_refused', error); throw error; }); settled = true; diagnostic('stdio_unknown_settled'); }"),
           ("              const custody = readMcpRunResourceOwner(native, binding);",
            "              diagnostic('http_protocol_refused', error);\n              const custody = readMcpRunResourceOwner(native, binding);\n              diagnostic(custody.joined ? 'http_joined' : 'http_join_missing');"),
           ("                      else settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)).run;",
            "                      else {\n                        diagnostic('http_unknown_settlement');\n                        settled = (await settleMcpRunUnknown(driver, artifacts, owner, native, prepared.entry, claimed.entry)\n                          .catch(error => { diagnostic('http_unknown_refused', error); throw error; })).run;\n                        diagnostic('http_unknown_settled');\n                      }"),
          ]
          for old, new in steps:
              assert body.count(old) == 1, old
              body = body.replace(old, new)
          p.write_text(s[:start] + body + s[end:])

          # The installed Run logs only fixed phase/reason labels. Never print a raw error.
          fixed_close_labels = dict(labels)
          for path in (Path('src/kernel/canonical.ts'), Path('src/state/mcp-server-permission.ts'), Path('src/state/mcp-server-history.ts'),
              Path('src/state/tool-recovery.ts'), Path('src/state/recovery-closure.ts'), Path('src/state/mcp-server-policy.ts'), Path('src/state/execution-closure.ts')):
              for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,150})'", path.read_text()):
                  fixed_close_labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for message, label in list(fixed_close_labels.items()):
              fixed_close_labels[message + ' differs from retained authority'] = label + '_different'

          for path in (*Path('native/linux').glob('*mcp*.h'), Path('native/linux/worker-native.c')):
              for msg in re.findall(r'"((?:MCP stdio|Cannot retire|Linux worker)[A-Za-z0-9 _/,-]{3,120})"', path.read_text()):
                  fixed_close_labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          diagnostic = '''function diagnoseOriginalStdioFailure(phase: string, root: unknown) {
            try {
              const fixed: Record<string,string> = __FIXED_CLOSE_LABELS__;
              const labels: string[] = [];
              const visit = (value: unknown, depth: number) => {
                if (!(value instanceof Error) || depth > 4 || labels.length > 12) return;
                const msg = Object.getOwnPropertyDescriptor(value, 'message')?.value;
                const code = Object.getOwnPropertyDescriptor(value, 'code')?.value;
                labels.push(typeof msg === 'string' && Object.hasOwn(fixed, msg) ? fixed[msg]!
                  : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|LEASE_FENCED|REVISION_CONFLICT|ERR_CLIQ_RESOURCE_RETIREMENT|ERR_CLIQ_MCP_STDIO|ERR_CLIQ_STATE_OWNER_NATIVE|ERR_SQLITE_ERROR|ENOENT|EACCES)$/u.test(code)
                   ? code.toLowerCase() : value instanceof AggregateError ? 'aggregate' : value instanceof TypeError ? 'type' : 'other');
                visit(Object.getOwnPropertyDescriptor(value, 'cause')?.value, depth + 1);
                if (value instanceof AggregateError) {
                  const errors = Object.getOwnPropertyDescriptor(value, 'errors')?.value;
                  if (Array.isArray(errors)) for (const error of errors.slice(0, 4)) visit(error, depth + 1);
                }
              };
              visit(root, 0);
              process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_' + phase + (labels.length ? '__' + labels.join('__') : '') + '\\n');
            } catch {}
          }
          '''.replace('__FIXED_CLOSE_LABELS__', json.dumps(fixed_close_labels))
          for filename, needle, replacement in (
            ('src/state/mcp-stdio-run.ts', '    } catch (error) {\n      failure = error;',
             '    } catch (error) {\n      diagnoseOriginalStdioFailure("original", error);\n      failure = error;'),
            ('src/sandbox/mcp-stdio-native.ts', '    if (failures.length) throw failures.find(error => error instanceof ResourceRetirementError) ??',
             '    if (failures.length) diagnoseOriginalStdioFailure("cleanup", new AggregateError(failures));\n    if (failures.length) throw failures.find(error => error instanceof ResourceRetirementError) ??'),
          ):
              path = Path(filename)
              code = path.read_text()
              assert code.count(needle) == 1
              path.write_text(code.replace(needle, replacement) + '\n' + diagnostic)

          p = Path('src/state/mcp-stdio-run.ts')
          s = p.read_text()
          steps = [
           ('      const broker = await track(loadInstalledMcpStdioBroker', 'broker'),
           ('      image = await track(sealInstalledMcpStdioServer', 'image'),
           ('      launcher = await track(openInstalledLinuxWorkerLauncher', 'launcher'),
           ('      serverPrepared = await input.agent.prepareMcpServer', 'server_preparation'),
           ('      physical = openRunMcpStdioInput', 'original_input'),
           ('      await scope.reservation();', 'scope_reservation'),
           ('      serverClaim = await input.agent.claimMcpServer', 'server_claim'),
           ('      assertOpen(); scope.createBlocked();', 'server_ready'),
           ('      await driveMcpStdioRunSetup', 'original_protocol_setup'),
           ('      instance = await publishMcpServerInstance', 'instance_persistence'),
           ('      effectClaim = await input.agent.claimTool', 'effect_claim'),
           ('      await driveMcpStdioRunCall', 'original_protocol_call'),
          ]
          for statement, phase in steps:
              assert s.count(statement) == 1, statement
              marker = "      try { process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_mark_" + phase + "\\n'); } catch {}\n"
              s = s.replace(statement, marker + statement)
          p.write_text(s)
          p = Path('src/state/mcp-server-lifecycle.ts')
          s = p.read_text()
          start = s.index('    claimMcpServer: stateOperation')
          claim = s[start:]
          claim = claim.replace('      const cut = await original.cut(input.expectedRunRevision, reads), selected = await context(cut, reads);',
            '      claimMark("cut"); const cut = await original.cut(input.expectedRunRevision, reads);\n      claimMark("context"); const selected = await context(cut, reads);')
          for statement, phase in (
            ('      await original.assertRuntime(', 'runtime'),
            ('      const proof = await readMcpServerGrant(', 'grant'),
            ('      requireEqual(binding,', 'binding'),
            ('      const reservation = readInstalledMcpStdioRunReservation(', 'reservation'),
            ('      const recipe = await originalRecipe(', 'recipe'),
            ('      if (!(await reads.readBytes(', 'recipe_bytes'),
            ('      const effectGrant = await readCanonicalArtifact<', 'effect_grant'),
            ('      assertInstalledMcpStdioRunOwner(native, binding);', 'native_owner'),
            ('      const claimed = await claimValidatedInvocation(', 'claim'),
            ('        original.assertCut(connection, run, cut);', 'transaction'),
            ('      liveLaunches.set(', 'committed'),
          ):
              assert statement in claim, statement
              offset = claim.index(statement)
              claim = claim[:offset] + '      claimMark(\"' + phase + '\");\n' + claim[offset:]
          p.write_text(s[:start] + claim + '''
          function claimMark(step: string): void {
            try { process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_claim_' + step + '\\n'); } catch {}
          }
          ''')
          PY
      - name: Observe native stdio currentness refusals using closed labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/linux/mcp-stdio-native.h')
          s = p.read_text()
          start = s.index('static bool mcp_stdio_native_current(')
          end = s.index('static bool mcp_stdio_request(', start)
          block = s[start:end]
          for check, label in (
              ('!c->retirement_failed', 'controller_retirement'),
              ('!atomic_load(&native_retirement_failed)', 'global_retirement'),
              ('anchor_current(c)', 'anchor'),
              ('controller_placement(c, c->token)', 'controller_placement'),
              ('scope->run->assert_current(scope->run)', 'run_input'),
              ('scope->admin->assert_current(scope->admin)', 'admin_input'),
              ('scope->recovery->assert_current(scope->recovery)', 'recovery_input'),
          ):
              assert block.count(check) == 1
              block = block.replace(check, 'mcp_pr536_scope_check((' + check + '), "' + label + '", scope)')
          body = '''static bool mcp_pr536_scope_check(bool condition, const char *reason, const struct mcp_stdio_native_scope *scope) {
              static unsigned total;
              if (!condition && total++ < 18) {
                  struct timespec sample;
                  uint64_t now = clock_gettime(CLOCK_REALTIME, &sample) == 0 ? (uint64_t)sample.tv_sec * 1000 + (uint64_t)sample.tv_nsec / 1000000 : 0;
                  fprintf(stderr, "CLIQ_PR536_AMBIGUITY_stdio_native_%s__%s__%s\\n", reason,
                      now >= scope->identity.stdio_launch_deadline_ms ? "launch_expired" : "launch_open",
                      now >= scope->identity.stdio_call_deadline_ms ? "call_expired" : "call_open");
              }
              return condition;
          }
          '''
          p.write_text(s[:start] + body + block + s[end:])
          p = Path('src/sandbox/mcp-stdio-native.ts')
          s = p.read_text()
          start = s.index('export function readInstalledMcpStdioRunReservation(')
          end = s.index('export function', start + len('export function'))
          block = s[start:end]
          block = block.replace('  const held = heldScope(scope, input,',
            "  try { process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_reservation_assert_selection\\n'); } catch {}\n  const held = heldScope(scope, input,")
          block = block.replace('  held.native.assertReserved(held.reservation);',
            "  try { process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_reservation_assert_native\\n'); } catch {}\n  held.native.assertReserved(held.reservation);")
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Classify the original stdio claim refusal without changing its fences
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/reducers/tool.ts')
          s = p.read_text()
          needle = '          const live = assertLiveDispatchState(connection, owner, runId, input.expectedRunRevision, input.leaseEpoch, now);\n          if (binding.dispatchJournalSeq'
          assert s.count(needle) == 1
          s = s.replace(needle, '''          let live: ReturnType<typeof assertLiveDispatchState>;
                    try { live = assertLiveDispatchState(connection, owner, runId, input.expectedRunRevision, input.leaseEpoch, now); }
                    catch (error) {
                      try { process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_effect_worker_fenced\\n'); } catch {}
                      throw error;
                    }
                    if (mcpOwner.kind === 'stdio') try {
                      if (binding.dispatchJournalSeq !== nextJournalSequence(connection, runId))
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_effect_journal_sequence_changed\\n');
                      if (Date.parse(now) >= binding.deadlineMs) process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_effect_call_deadline_elapsed\\n');
                      if (!live.launch.leaseExpiresAt || binding.workerLaunchId !== live.launch.launchId)
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_effect_worker_identity_changed\\n');
                      if (live.launch.leaseExpiresAt && binding.deadlineMs > Math.min(Date.parse(run.deadlineAt), Date.parse(proof.grant.expiresAt), Date.parse(live.launch.leaseExpiresAt)))
                        process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_effect_call_deadline_exceeds_retained_bound\\n');
                    } catch {}
                    if (binding.dispatchJournalSeq''')
          p.write_text(s)
          PY
      - name: Distinguish an expired MCP call from the original permission refusal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/mcp-server-lifecycle.ts')
          source = p.read_text()
          anchor = "      if (!selected?.grant) throw new KernelStorageError('STATE_TRANSITION_INVALID', 'MCP server launch requires its own exact permission before preparation');"
          assert source.count(anchor) == 1
          source = source.replace(anchor, """      if (!selected?.grant) {
                  try {
                    const reason = selected?.unavailableReason === 'mcp_call_deadline_exceeded' ? 'original_call_deadline'
                      : selected?.unavailableReason === 'mcp_server_launch_exhausted' ? 'original_launch_ceiling'
                      : selected ? 'grant_unavailable' : 'selection_unavailable';
                    process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_preparation_' + reason + '\\n');
                  } catch {}
                  throw new KernelStorageError('STATE_TRANSITION_INVALID', 'MCP server launch requires its own exact permission before preparation');
                }""")
          p.write_text(source)
          PY
      - name: Identify the exact original server claim condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/mcp-server-lifecycle.ts')
          source = p.read_text()
          anchor = "        if (!tool || tool.requestRef !== selected.request.toolRequestRef || readInvocationAttempt(connection, runId, tool.opId, tool.attempt).length !== 1 ||\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, """        try {
                    const diagnostics = [
                      [!tool || tool.requestRef !== selected.request.toolRequestRef || readInvocationAttempt(connection, runId, tool.opId, tool.attempt).length !== 1, 'owning_preparation'],
                      [binding.dispatchJournalSeq !== nextJournalSequence(connection, runId), 'journal_sequence'],
                      [now < proof.grant.issuedAt || now >= proof.grant.expiresAt, 'grant_time'],
                      [!live.launch.leaseExpiresAt || tool && binding.callDeadlineMs !== Math.min(parseCanonicalTime(tool.timestamp) + selected.target.callTimeoutMs,
                        parseCanonicalTime(run.deadlineAt), parseCanonicalTime(proof.grant.expiresAt), parseCanonicalTime(effectGrant.expiresAt),
                        parseCanonicalTime(live.launch.leaseExpiresAt), selected.callDeadlineMs ?? Number.MAX_SAFE_INTEGER), 'call_bound'],
                      [binding.launchDeadlineMs !== Math.min(parseCanonicalTime(prepared.timestamp) + selected.target.launchTimeoutMs, binding.callDeadlineMs), 'launch_bound'],
                      [parseCanonicalTime(now) >= binding.launchDeadlineMs, 'original_launch_deadline']
                    ] as const;
                    for (const [failed, reason] of diagnostics)
                      if (failed) process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_launch_claim_' + reason + '\\n');
                  } catch {}
          """ + anchor)
          p.write_text(source)
          PY
      - name: Identify the exact preparation fence and elapsed stage bands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/mcp-server-lifecycle.ts')
          source = p.read_text()
          anchor = "        if (readInvocationAttempt(connection, runId, expectedTool.opId, expectedTool.attempt).length !== 1 || now < createdAt ||\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, """        try {
                    const diagnostics = [
                      [readInvocationAttempt(connection, runId, expectedTool.opId, expectedTool.attempt).length !== 1, 'owning_preparation'],
                      [now < createdAt, 'original_time_order'],
                      [now < selected.grant!.issuedAt || now >= selected.grant!.expiresAt, 'grant_time'],
                      [parseCanonicalTime(now) >= launchDeadlineMs, 'original_launch_deadline'],
                      [sha256Bytes(readInstalledMcpStdioRecipeData(native)) !== recipe.data.recipeDigest, 'recipe_changed'],
                      [selected.context.claims >= selected.context.target.maxLaunches, 'launch_ceiling']
                    ] as const;
                    for (const [failed, reason] of diagnostics)
                      if (failed) process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_prepare_commit_' + reason + '\\n');
                  } catch {}
          """ + anchor)
          p.write_text(source)

          p = Path('src/state/mcp-stdio-run.ts')
          source = p.read_text()
          anchor = "    let failure: unknown, outputSchema: unknown;\n"
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + "    let diagnosticLast = Date.now();\n")
          needle = "process.stderr.write('CLIQ_PR536_AMBIGUITY_stdio_mark_"
          assert source.count(needle) >= 10
          count = 0
          for line in source.splitlines():
              if needle not in line:
                  continue
              phase = line.split(needle, 1)[1].split(r"\n", 1)[0]
              marker = needle + phase + r"\n');"
              assert marker in line
              updated = needle + phase + "_bucket_' + Math.min(600, Math.max(0, Math.floor((Date.now() - diagnosticLast) / 100))) + '\\n'); diagnosticLast = Date.now();"
              source = source.replace(marker, updated)
              count += 1
          assert count >= 10, str(count)
          p.write_text(source)
          PY
      - run: npm run build
      - name: Check the actual installed campaign import closure
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --esModuleInterop --jsx react-jsx
          scripts/kernel/testing/postject.d.ts
          scripts/kernel/qualify-installed-mcp-recovery-journey.ts
      - name: Check original status, retry and complete Session data contracts
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/kernel/mcp-status.test.ts
          src/state/mcp-status-proof.test.ts
          src/state/mcp-recovery-admission.test.ts
          src/state/mcp-status-projection.test.ts
          src/state/reconciliation-capacity.test.ts
          scripts/kernel/testing/installed-session-segments.test.ts
          scripts/kernel/testing/installed-mcp-retry-http.test.ts
      - name: Install original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual C recipe and natural lost responses
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-stdio-native-data.test.ts
      - name: Exercise the complete signed installation and original v1 entry
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_AMBIGUITY_' |
              /bin/grep -E '^CLIQ_PR536_AMBIGUITY_[a-z0-9_]{1,650}$' |
              head -80 || true
          }
          trap report_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-recovery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-recovery"
      - name: Preserve fixed JSON scope and actual cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-installed-mcp-recovery/installed-run-journey.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-before.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-after.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/cleanup.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/run-filesystem.json
          if-no-files-found: warn
          retention-days: 7

