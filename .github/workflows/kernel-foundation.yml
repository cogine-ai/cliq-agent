name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery-delayed-volume:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-frozen-generation' && inputs.expected_revision == 'd840bf5b82e6a4120ed6bba420a07352534cd675' }}
    name: Linux installed Delivery on owned delayed storage
    # A separate free standard disposable VM, not a host/global-disk fixture.
    # This retains the ordinary complete Delivery assertions. Fixed timing
    # diagnostics do not qualify a late result or an in-flight stop by themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/supervisor-sea-builder.test.ts scripts/kernel/testing/installed-publication-retirement.test.ts scripts/kernel/testing/installed-publication-journal.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts
      - run: npm run build
        id: build
      - name: Install actual guest, Secret Service and owned-volume prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config dmsetup kmod
      - name: Exercise both actual Linux root protocol-child lifetimes
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo "$probe_node" --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-publication-crash-observer.test.ts
      - name: Require the disposable hosted VM and its actual fixed delay target
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          if [[ ! -d /sys/module/dm_delay ]]; then sudo /usr/sbin/modprobe dm_delay; fi
          sudo /usr/bin/udevadm settle --timeout=5
          test -d /sys/module/dm_mod
          test -d /sys/module/dm_delay
          test -c /dev/mapper/control
      - name: Exercise the unchanged installed Delivery closure on the unique owned delayed volume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --delay-volume --run-delivery-delay-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-delayed-volume"
      - name: Retain only bounded reports and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-delayed-volume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-delayed-volume/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-verifier:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-frozen-generation' && inputs.expected_revision == 'd840bf5b82e6a4120ed6bba420a07352534cd675' }}
    name: Linux signed installed required and advisory Node verifier
    # Standard public-repository runner. Its own full installation/corpus and
    # 20-minute budget do not replace or dilute any original campaign.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-run-client.test.mjs scripts/kernel/testing/installed-client-journey.test.mjs scripts/kernel/testing/installed-status-regression.test.mjs
      - run: node --test --import tsx scripts/kernel/guest-image-layout.test.mjs scripts/kernel/testing/installed-guest-package.test.ts scripts/kernel/testing/installed-client-consumer.test.ts scripts/kernel/testing/installed-control-client-driver.test.ts scripts/kernel/testing/installed-enroll-diagnostic.test.ts
      - run: npm run build
        id: build
      - name: Install actual guest, transport and Secret Service prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check the actual native dependency family before installed qualification
        run: |
          node --test --test-concurrency=1 --import tsx scripts/kernel/testing/dependency-native-family.test.ts scripts/kernel/testing/dependency-broker-lifecycle.test.ts scripts/kernel/testing/dependency-npm-stage.test.ts scripts/kernel/testing/preparing-git-native.test.ts scripts/kernel/testing/installed-genesis.test.ts
          node --test --test-concurrency=1 --import tsx src/sandbox/sealed-images.test.ts src/sandbox/builtin-tool-native.test.ts
          if ! git cat-file -e 'ba804a59dcadee80cb41c822e2d0e32198462f20^{commit}'; then
            git fetch --no-tags --depth=1 origin ba804a59dcadee80cb41c822e2d0e32198462f20
          fi
          node --import tsx scripts/kernel/testing/qualify-native-callback-lifecycle.ts "$RUNNER_TEMP/cliq-native-callback-lifecycle"
      - name: Acquire the exact official npm qualification source
        id: npm_source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { constants } from 'node:fs';
          import { open } from 'node:fs/promises';
          import path from 'node:path';
          import { NPM_DATA_RECIPE } from './src/sandbox/npm-data-image.ts';
          import { buildInstalledNpmDataAsset } from './scripts/kernel/testing/installed-npm-package.ts';
          assert(typeof process.env.RUNNER_TEMP === 'string' && path.isAbsolute(process.env.RUNNER_TEMP));
          const response = await fetch(NPM_DATA_RECIPE.officialArchive, {
            redirect: 'error', signal: AbortSignal.timeout(60000)
          });
          const chunks = []; let total = 0;
          try {
            assert.equal(response.status, 200); assert(response.body);
            for await (const chunk of response.body) {
              total += chunk.byteLength; assert(total <= NPM_DATA_RECIPE.archiveBytes);
              chunks.push(Buffer.from(chunk));
            }
          } finally { await response.body?.cancel(); }
          assert.equal(total, NPM_DATA_RECIPE.archiveBytes);
          const archive = Buffer.concat(chunks, total);
          buildInstalledNpmDataAsset(archive);
          const file = await open(path.join(process.env.RUNNER_TEMP, 'cliq-official-npm-10.9.2.tgz'),
            constants.O_WRONLY | constants.O_CREAT | constants.O_EXCL | constants.O_NOFOLLOW, 0o600);
          try { await file.writeFile(archive); await file.sync(); } finally { await file.close(); }
          NODE
      - name: Observe the fixed original installed status deadlock
        shell: bash
        run: |
          if ! git cat-file -e 'b6140b57836e19b0fb937327af449e8138f47eca^{commit}'; then
            git fetch --no-tags --depth=1 origin b6140b57836e19b0fb937327af449e8138f47eca
          fi
          mkdir -m 700 "$RUNNER_TEMP/cliq-installed-status-regression"
          node scripts/kernel/testing/installed-status-regression.mjs "$RUNNER_TEMP/cliq-installed-status-regression/status-borrow-regression.json"
      - name: Exercise signed installed identity grant, Node verifier, repair and terminal replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.npm_source.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          probe_npm_archive="$RUNNER_TEMP/cliq-official-npm-10.9.2.tgz"
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-verifier-journey --locked-node "$probe_npm_archive" "$probe_node" "$RUNNER_TEMP/cliq-installed-verifier-journey"
      - name: Retain only bounded installed verifier and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-verifier-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-verifier-journey/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain only the closed original status regression observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-status-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-status-regression/status-borrow-regression.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain only bounded native callback receipts and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-callback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-native-callback-lifecycle/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain bounded native callback source and joined output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-callback-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.json
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.tap
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.stderr
            ${{ runner.temp }}/cliq-native-callback-lifecycle/*.source.tar
            ${{ runner.temp }}/cliq-native-callback-lifecycle/carrier/*.tar.xz
          if-no-files-found: warn
          retention-days: 7

  linux-installed-permission:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-frozen-generation' && inputs.expected_revision == 'd840bf5b82e6a4120ed6bba420a07352534cd675' }}
    name: Linux signed installed verifier and Delivery permissions
    # A separate standard free runner preserves every original campaign.
    # This owned HTTPS fixture cannot qualify a paid provider or real TTY.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the closed report and owned model responder
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-permission-result.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise exact approvals, repair, refusal, templates and Delivery
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-permission-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-permission-journey"
      - name: Retain bounded permission and original cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-permission-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-permission-journey/*.json
          if-no-files-found: warn
          retention-days: 7

