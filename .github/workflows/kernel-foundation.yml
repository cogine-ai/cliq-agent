name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp-recovery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-remaining-cuts' && inputs.expected_revision == 'ebe79a7244e69e872cae55841daa91709f9b04eb' }}
    name: Linux signed MCP status, retry and owning shutdown
    # Public repository: standard free runner, with the original production
    # build, lifecycle, billing and deadline assertions left intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Time the original native stdio launch and fixed claim deadline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run = Path('src/state/mcp-stdio-run.ts')
          source = run.read_text()
          at_start = '    let failure: unknown, outputSchema: unknown;'
          assert source.count(at_start) == 1
          source = source.replace(at_start, at_start + """
              let previous = performance.now();
              function noteStdioCut(phase: string) {
                try {
                  const current = performance.now();
                  process.stderr.write('CLIQ_PR536_STDIO_CURRENT ' + phase + ' ' + Math.min(10000, Math.floor(current - previous)) + '\\n');
                  previous = current;
                } catch { /* Timing supplies no outcome. */ }
              }
          """)
          for statement, phase in [
            ('      await track(native.ready);', 'native_preparation_issued'),
            ('      serverPrepared = await input.agent.prepareMcpServer(', 'server_preparation_started'),
            ('      physical = openRunMcpStdioInput(', 'server_preparation_returned'),
            ('      await scope.reservation();', 'reservation_started'),
            ('      serverClaim = await input.agent.claimMcpServer(', 'claim_started'),
            ('      input.onLaunchClaimed();', 'claim_returned'),
            ('      serverClaim.assertLaunchRelease();', 'scope_ready'),
            ('      instance = await publishMcpServerInstance(', 'protocol_setup_returned'),
            ('      effectClaim = await input.agent.claimTool(', 'effect_claim_started'),
            ('      input.onEffectClaimed(effectClaim);', 'effect_claim_returned'),
            ('    finally { await closeResources(); }', 'native_cleanup_started'),
          ]:
              assert source.count(statement) == 1, phase
              source = source.replace(statement, "      noteStdioCut('" + phase + "');\n" + statement if phase != 'native_cleanup_started'
                else "    finally { noteStdioCut('native_cleanup_started'); await closeResources(); noteStdioCut('native_cleanup_returned'); }")
          run.write_text(source)

          lifecycle = Path('src/state/mcp-server-lifecycle.ts')
          source = lifecycle.read_text()
          anchor = "        if (!tool || tool.requestRef !== selected.request.toolRequestRef || readInvocationAttempt(connection, runId, tool.opId, tool.attempt).length !== 1 ||"
          assert source.count(anchor) == 1
          lifecycle.write_text(source.replace(anchor, """        try {
                    const ageMs = parseCanonicalTime(now) - parseCanonicalTime(prepared.timestamp);
                    if (Number.isSafeInteger(ageMs) && ageMs >= 0) process.stderr.write('CLIQ_PR536_STDIO_CURRENT claim_transaction ' +
                      Math.min(10000, ageMs) + ' ' + (parseCanonicalTime(now) >= binding.launchDeadlineMs ? 'expired' : 'within_deadline') + '\\n');
                  } catch { /* Keep every original gate and error. */ }
          """ + anchor))
          PY
      - run: npm run build
      - name: Check the actual installed campaign import closure
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --esModuleInterop --jsx react-jsx
          scripts/kernel/testing/postject.d.ts
          scripts/kernel/qualify-installed-mcp-recovery-journey.ts
      - name: Check original status, retry and complete Session data contracts
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/kernel/mcp-status.test.ts
          src/state/mcp-status-proof.test.ts
          src/state/mcp-recovery-admission.test.ts
          src/state/mcp-status-projection.test.ts
          src/state/reconciliation-capacity.test.ts
          scripts/kernel/testing/installed-session-segments.test.ts
          scripts/kernel/testing/installed-mcp-retry-http.test.ts
      - name: Install original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual C recipe and natural lost responses
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-stdio-native-data.test.ts
      - name: Exercise the complete signed installation and original v1 entry
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-recovery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-recovery"
      - name: Preserve fixed JSON scope and actual cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-installed-mcp-recovery/installed-run-journey.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-before.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-after.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/cleanup.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/run-filesystem.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-permission:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-remaining-cuts' && inputs.expected_revision == 'ebe79a7244e69e872cae55841daa91709f9b04eb' }}
    name: Linux signed installed verifier and Delivery permissions
    # A separate standard free runner preserves every original campaign.
    # This owned HTTPS fixture cannot qualify a paid provider or real TTY.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add fixed non-authoritative permission cut timings to the disposable fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-permission-journey.ts')
          s = p.read_text()
          base = '    let cut: Data, denial: { frame: Data; response: Response } | undefined;'
          definition = '''    let observed = 0, readTime = 0, lastRevision: number | undefined;
              function notePermissionCut(point: 'read' | 'approval_begin' | 'approval_done', run: Data) {
                try {
                  const state = ['queued', 'running', 'waiting', 'succeeded', 'completed_unverified', 'failed', 'cancelled'].includes(run.status)
                    ? run.status : 'other';
                  const nextStep = ['agent', 'tool', 'verify', 'delivery', 'finalize'].includes(run.nextStep) ? run.nextStep : 'other';
                  const waiting = ['approval', 'input', 'reconciliation'].includes(run.waitingReason) ? run.waitingReason : 'other';
                  const elapsedMs = Math.max(0, Date.now() - (by - 90000));
                  console.error('CLIQ_PR536_PERMISSION ' + JSON.stringify({kind, point, state, nextStep, waiting,
                    revision: Number.isSafeInteger(run.revision) ? run.revision : null, elapsedMs, observed, readTime,
                    posts: context.responder.posts(kind), approvals, edits, workerFreeWaits, restarted}));
                } catch { /* Fixed data diagnosis never alters the real assertion. */ }
              }
          '''
          assert s.count(base) == 1
          s = s.replace(base, definition + base)
          start = '      cut = await get(admitted.id); const run = cut.snapshot.run;'
          assert s.count(start) == 1
          s = s.replace(start, '''      const startedRead = Date.now();
          ''' + start + '''
                observed++; readTime += Date.now() - startedRead;
                if (run.revision !== lastRevision || Date.now() >= by) {
                  lastRevision = run.revision; notePermissionCut('read', run);
                }
          ''')
          pre = '          seen.add(run.waitingOnRef); workerFreeWaits++;'
          assert s.count(pre) == 1
          s = s.replace(pre, pre + "\n          notePermissionCut('approval_begin', run);")
          post = "      assert(Date.now() < by, 'ordinary permission case exceeded the original 90-second source window');"
          assert s.count(post) == 1
          s = s.replace(post, "      if (Date.now() >= by) notePermissionCut('approval_done', run);\n" + post)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Check the closed report and owned model responder
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-permission-result.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise exact approvals, repair, refusal, templates and Delivery
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-permission-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-permission-journey"
      - name: Retain bounded permission and original cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-permission-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-permission-journey/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-installed-delivery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-remaining-cuts' && inputs.expected_revision == 'ebe79a7244e69e872cae55841daa91709f9b04eb' }}
    name: Linux signed installed explicit Delivery and terminal replay
    # Independent standard public runner; no feature override or replacement
    # for verifier, ordinary Run, shutdown or namespace qualification.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-run-client.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/installed-delivery-result.test.ts scripts/kernel/testing/installed-delivery-publication-result.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-client-consumer.test.ts scripts/kernel/testing/installed-control-client-driver.test.ts scripts/kernel/testing/installed-enroll-diagnostic.test.ts
      - name: Retain the exact public cut at the original cleanup recovery deadline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          progress = Path('scripts/kernel/testing/installed-run-progress.ts')
          source = progress.read_text()
          existing = "'delivery_git_merge'] as const;"
          assert source.count(existing) == 1
          progress.write_text(source.replace(existing, "'delivery_git_merge', 'delivery_cleanup_crash'] as const;"))

          driver = Path('scripts/kernel/testing/installed-node-journey.ts')
          source = driver.read_text()
          existing = "              assert(Date.now() < by, 'actual cleanup crash recovery exceeded its original 90-second window'); await delay(50);"
          assert source.count(existing) == 1
          driver.write_text(source.replace(existing, """              try {
                          assert(Date.now() < by, 'actual cleanup crash recovery exceeded its original 90-second window');
                        } catch (original) {
                          // The same authenticated read that triggered the exact deadline.
                          // Never issue another request or wait to make this sample.
                          try {
                            report.publicationCleanupCrashDeadline = projectInstalledRunProgress({
                              caseKind: 'delivery_cleanup_crash', cut: recovered, postCount: 0
                            });
                          } catch { /* Retain the primary deadline failure. */ }
                          throw original;
                        }
                        await delay(50);"""))
          PY
      - run: npm run build
        id: build
      - name: Install actual guest, transport and Secret Service prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise explicit publication, drift merge, cancellation, reconnect and restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-delivery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-journey"
      - name: Retain only bounded installed Delivery and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-journey/*.json
          if-no-files-found: warn
          retention-days: 7

