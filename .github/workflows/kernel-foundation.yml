name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp-recovery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-consent' && inputs.expected_revision == 'a2e8a9295f85a778db1b3640fd8b93a4ad00017c' }}
    name: Linux signed MCP status, retry and owning shutdown
    # Public repository: standard free runner, with the original production
    # build, lifecycle, billing and deadline assertions left intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add fixed stdio-consent and original-channel audit stages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          paths = ['mcp-registration.ts', 'mcp-stdio-consent.ts', 'authorization.ts', 'control-channel.ts',
                   'state-owner-history.ts', 'errors.ts', 'repositories/authorization-grants.ts', 'sqlite-driver.ts',
                   'cas.ts', 'native-owner.ts', 'runtime-upgrade-history.ts']
          labels = {}
          for name in paths:
              source = (Path('src/state') / name).read_text()
              for message in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,150})'", source):
                  labels[message] = re.sub(r'[^a-z0-9]+', '_', message.lower()).strip('_')
          labels = json.dumps(labels, ensure_ascii=True)
          targets = [
              ('mcp-registration.ts', 'async function readOriginalAdminRequest(', '  const request =', 'request', [
                  ('  const request =', 'artifact'), ('  const channel =', 'channel'), ('  const first =', 'attempt'),
                  ('  const latestOwner =', 'owner'), ('  const ownerHistory =', 'history'),
                  ('    const peer =', 'peer'), ('      const consent = await readMcpStdioRegistrationConsent', 'consent'),
                  ('    await validateMcpOriginalRequestedRecovery', 'recovery')]),
              ('mcp-stdio-consent.ts', 'export async function readMcpStdioRegistrationConsent(', '  const grant =', 'consent', [
                  ('  const grant =', 'grant'), ('  const history =', 'history'), ('  const receipt =', 'receipt'),
                  ('  requireEqual(transport.executable', 'transport')]),
              ('authorization.ts', 'export async function readMcpStdioAuthorizationHistory(', '  const reads =', 'auth', [
                  ('  const reads =', 'entry'), ('  const row =', 'creation_row'), ('  const [{ channel }', 'creation_data'),
                  ('  const request =', 'original_request'), ('  const bundle =', 'bundle'),
                  ('  const { target: reproduced }', 'verify_image'), ('    const receipt =', 'receipt'),
                  ('    const { readMcpAdminOperation }', 'consumer')]),
          ]
          for name, entry, first, phase, stages in targets:
              p = Path('src/state') / name
              s = p.read_text()
              start = s.index(first, s.index(entry))
              end = s.index('\n}', start)
              body = s[start:end]
              for code, label in stages:
                  assert body.count(code) == 1, (name, code)
                  body = body.replace(code, "  diagnosticStage = '"+label+"';\n"+code, 1)
              before = "\n  let diagnosticStage = 'entry';\n  try {\n"
              after = '''
            } catch (error) {
              try {
                const staticMessages: Record<string, string> = __LABELS__;
                const chain: string[] = [];
                let item: unknown = error;
                for (let i = 0; i < 4 && item instanceof Error; i++) {
                  const msg = Object.getOwnPropertyDescriptor(item, 'message')?.value;
                  const code = Object.getOwnPropertyDescriptor(item, 'code')?.value;
                  chain.push(typeof msg === 'string' && Object.hasOwn(staticMessages, msg) ? staticMessages[msg]!
                    : typeof code === 'string' && /^(ENOENT|EACCES|ERR_SQLITE_ERROR|RECOVERY_REQUIRED|ARTIFACT_MISMATCH|INVALID_REQUEST)$/u.test(code) ? code.toLowerCase()
                    : item instanceof TypeError ? 'type' : 'other');
                  item = Object.getOwnPropertyDescriptor(item, 'cause')?.value;
                }
                process.stderr.write('CLIQ_PR536_MCP_CONSENT_PHASE_' + diagnosticStage + '__' + chain.join('__') + '\\n');
              } catch {}
              throw error;
            }'''.replace('PHASE', phase).replace('__LABELS__', labels)
              p.write_text(s[:start] + before + body + after + s[end:])
          PY
      - run: npm run build
      - name: Check the actual installed campaign import closure
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --esModuleInterop --jsx react-jsx
          scripts/kernel/testing/postject.d.ts
          scripts/kernel/qualify-installed-mcp-recovery-journey.ts
      - name: Check original status, retry and complete Session data contracts
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/kernel/mcp-status.test.ts
          src/state/mcp-status-proof.test.ts
          src/state/mcp-recovery-admission.test.ts
          src/state/mcp-status-projection.test.ts
          src/state/reconciliation-capacity.test.ts
          scripts/kernel/testing/installed-session-segments.test.ts
          scripts/kernel/testing/installed-mcp-retry-http.test.ts
      - name: Install original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual C recipe and natural lost responses
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-stdio-native-data.test.ts
      - name: Exercise the complete signed installation and original v1 entry
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_original_consent_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_MCP_CONSENT_' |
              /bin/grep -E '^CLIQ_PR536_MCP_CONSENT_[a-z0-9_]{1,500}$' |
              head -50 || true
          }
          trap report_original_consent_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-recovery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-recovery"
      - name: Preserve fixed JSON scope and actual cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-installed-mcp-recovery/installed-run-journey.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-before.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-after.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/cleanup.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/run-filesystem.json
          if-no-files-found: warn
          retention-days: 7

