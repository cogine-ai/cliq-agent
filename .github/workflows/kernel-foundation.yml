name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp-recovery:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-submit' && inputs.expected_revision == '2c557a04a6274f25d550fdcde21af28050b030f2' }}
    name: Linux signed MCP status, retry and owning shutdown
    # Public repository: standard free runner, with the original production
    # build, lifecycle, billing and deadline assertions left intact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Identify the exact MCP Run assembly error and owning source line
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          files = [
           'src/state/installed-run.ts', 'src/state/mcp-registration.ts', 'src/state/mcp-input-authority.ts',
           'src/state/mcp-admission.ts', 'src/state/guest-toolchain.ts', 'src/state/verifier-admission.ts',
           'src/tools/input-contract.ts', 'src/tools/input-schema.ts', 'src/tools/execution-identity.ts',
           'src/policy/runtime-authority.ts', 'src/model/run-assembly.ts', 'src/kernel/mcp.ts',
           'src/kernel/json.ts', 'src/state/errors.ts', 'src/state/agent-context.ts'
          ]
          labels = {}
          for name in files:
              for message in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{5,160})'", Path(name).read_text()):
                  labels[message] = re.sub(r'[^a-z0-9]+', '_', message.lower()).strip('_')
          p = Path('src/state/installed-run-diagnostics.ts')
          s = p.read_text()
          start = s.index('export function beginInstalledApplyDiagnostic()')
          end = s.index('\n}', start)
          old = '    failure(error: unknown, closing: boolean): void {'
          body = s[start:end]
          diagnostic = '''
                if (current === 'submit_assembly_material') {
                  try {
                    const messages: Record<string, string> = __LABELS__;
                    const trace: string[] = [];
                    let cause: unknown = error;
                    for (let i = 0; i < 4 && cause instanceof Error; i++) {
                      const msg = Object.getOwnPropertyDescriptor(cause, 'message')?.value;
                      const code = Object.getOwnPropertyDescriptor(cause, 'code')?.value;
                      trace.push(typeof msg === 'string' && Object.hasOwn(messages, msg) ? messages[msg]!
                        : typeof code === 'string' && /^(ENOENT|EACCES|ERR_SQLITE_ERROR|RECOVERY_REQUIRED|ARTIFACT_MISMATCH|INVALID_REQUEST)$/u.test(code)
                        ? code.toLowerCase() : cause instanceof TypeError ? 'type' : 'other');
                      cause = Object.getOwnPropertyDescriptor(cause, 'cause')?.value;
                    }
                    process.stderr.write('CLIQ_PR536_MCP_SUBMIT_' + trace.join('__') + '\\n');
                  } catch {}
                }
          '''.replace('__LABELS__', json.dumps(labels))
          assert body.count(old) == 1
          p.write_text(s[:start] + body.replace(old, old + diagnostic) + s[end:])
          p = Path('scripts/kernel/testing/installed-node-journey.ts')
          s = p.read_text()
          old = 'qualify-installed-permission-journey|installed-permission-journey|'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + 'installed-mcp-journey|installed-mcp-stdio-journey|installed-mcp-recovery-journey|'))
          PY
      - run: npm run build
      - name: Check the actual installed campaign import closure
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --esModuleInterop --jsx react-jsx
          scripts/kernel/testing/postject.d.ts
          scripts/kernel/qualify-installed-mcp-recovery-journey.ts
      - name: Check original status, retry and complete Session data contracts
        run: >-
          node --test --test-concurrency=1 --import tsx
          src/kernel/mcp-status.test.ts
          src/state/mcp-status-proof.test.ts
          src/state/mcp-recovery-admission.test.ts
          src/state/mcp-status-projection.test.ts
          src/state/reconciliation-capacity.test.ts
          scripts/kernel/testing/installed-session-segments.test.ts
          scripts/kernel/testing/installed-mcp-retry-http.test.ts
      - name: Install original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual C recipe and natural lost responses
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-stdio-native-data.test.ts
      - name: Exercise the complete signed installation and original v1 entry
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_source_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_MCP_SUBMIT_' |
              /bin/grep -E '^CLIQ_PR536_MCP_SUBMIT_[a-z0-9_]{1,650}$' |
              head -50 || true
          }
          trap report_source_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-recovery-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-recovery"
      - name: Preserve fixed JSON scope and actual cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cliq-installed-mcp-recovery/installed-run-journey.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-before.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/runner-baseline-after.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/cleanup.json
            ${{ runner.temp }}/cliq-installed-mcp-recovery/run-filesystem.json
          if-no-files-found: warn
          retention-days: 7

