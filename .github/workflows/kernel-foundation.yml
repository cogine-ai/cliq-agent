name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-http-successor-only' && inputs.expected_revision == 'f12b81a05119e2332b39af54c84538c758df9713' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Observe only the original test-owned HTTP ambiguity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-mcp-journey.ts')
          s = p.read_text()
          needle = '  for (const kind of INSTALLED_MCP_CASES) {'
          assert s.count(needle) == 1
          needle = '    let cut: Data;'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n    let lastState: string | undefined;')
          needle = '      assert(Date.now() < by, \'the observed MCP result arrived after the original 90-second window\');'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                const run = cut.snapshot.run;
                const row = cut.journal.filter((entry: Data) => entry.opKind === 'mcp').at(-1);
                const state = [run.status, run.waitingReason ?? 'none', row?.phase ?? 'none'].join('_');
                if (state !== lastState && /^[a-z_]{1,100}$/u.test(state)) { lastState = state; context.mark('http_ambiguity_' + state); }
          ''')
          needle = '        if (wait.subject?.kind !== \'worker_death\') { decodeManualInvocationWait(wait); break; }'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                  const phase = wait.probeState?.phase, count = wait.probeState?.automaticProbeCount;
                  if (['automatic_pending','automatic_in_flight','automatic_exhausted'].includes(phase) && Number.isSafeInteger(count) && count >= 0 && count <= 8) {
                    const key = 'worker_death_' + phase + '_' + count;
                    if (key !== lastWorker) { lastWorker = key; context.mark('http_ambiguity_' + key); }
                  }
          ''').replace('    let lastState: string | undefined;', '    let lastState: string | undefined, lastWorker: string | undefined;')
          p.write_text(s)
          labels = {}
          for name in ('store', 'run-execution', 'worker-recovery', 'recovery-closure', 'mcp-execution', 'manual-reconciliation', 'worker-preparation',
            'reducers/worker-recovery', 'reducers/invocation', 'sqlite-driver', 'retained-generation', 'worker-stop'):
              path = Path('src/state/' + name + '.ts')
              if path.is_file():
                  for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{8,150})'", path.read_text()):
                      labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for msg, label in list(labels.items()):
              labels[msg + ' differs from retained authority'] = label + '_different'
          p = Path('src/state/store.ts')
          s = p.read_text()
          needle = '        this.installedRunFailures.set(runId, error);\n        diagnosis?.failure(error, this.closeRequested);'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                  try {
                    const safe: Record<string,string> = __LABELS__;
                    const labels: string[] = []; let item: unknown = error;
                    for (let i = 0; i < 5 && item instanceof Error; i++) {
                      const msg = Object.getOwnPropertyDescriptor(item, 'message')?.value;
                      const code = Object.getOwnPropertyDescriptor(item, 'code')?.value;
                      labels.push(typeof msg === 'string' && Object.hasOwn(safe, msg) ? safe[msg]!
                        : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|REVISION_CONFLICT|LEASE_FENCED|STATE_TRANSITION_INVALID|ERR_NODE_SQLITE_ERROR)$/u.test(code)
                          ? code.toLowerCase() : item instanceof TypeError ? 'type' : 'other');
                      item = Object.getOwnPropertyDescriptor(item, 'cause')?.value;
                    }
                    if (labels.length) process.stderr.write('CLIQ_PR536_HTTP_RECOVERY_' + labels.join('__') + '\\n');
                  } catch {}
          '''.replace('__LABELS__', json.dumps(labels)))
          p.write_text(s)
          PY
      - name: Classify only the existing HTTP acknowledgement boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('scripts/kernel/testing/installed-mcp-journey.ts')
          s = p.read_text()
          for needle, label in (('      for (const fields of [{ expectedRevision:', 'stale_controls'), ('      const acknowledgement = signed(', 'actual_abandon'), ('      const abandoned = cut.journal.filter(', 'terminal_run_read'), ('      await context.restart(); same(await get(runId), cut); assert.deepEqual', 'successor_replay'), ('    cases.push({ kind, nativeAdminRetired:', 'case_assertions_verified')):
              assert s.count(needle) == 1, needle
              s = s.replace(needle, "    context.mark('http_ambiguity_" + label + "');\n" + needle)
          p.write_text(s)
          labels = {msg: msg.lower().replace(' ', '_') for msg in ('FOREIGN KEY constraint failed', 'database is locked')}
          for file in ('manual-reconciliation.ts', 'reducers/stop.ts', 'broker-ambiguity.ts', 'recovery-closure.ts', 'errors.ts', 'sqlite-driver.ts', 'mcp-execution.ts',
            '../runtime/stop.ts', '../kernel/canonical.ts', 'state-owner-history.ts', 'control-channel.ts', 'session-context-graph.ts', 'state-owner.ts', 'rows.ts'):
              p = Path('src/state') / file
              if not p.is_file(): continue
              for msg in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{8,150})'", p.read_text()):
                  labels[msg] = re.sub(r'[^a-z0-9]+', '_', msg.lower()).strip('_')
          for msg, label in list(labels.items()):
              labels[msg + ' differs from retained authority'] = label + '_different'
          p = Path('src/state/store.ts')
          s = p.read_text()
          start = s.index("      if (value.resolution.kind === 'abandon_run') {")
          end = s.index('      await validateControlChannelClosure', start)
          block = s[start:end]
          block = block.replace("        const manual = await import('./manual-reconciliation.js');", "        let phase = 'replay';\n        try {\n        const manual = await import('./manual-reconciliation.js');")
          for needle, stage in (('        const plan = await manual.prepareManualInvocationFinalization', 'prepare'),
            ('        const agent = await this.retainInstalledAgent', 'retain'), ('        await agent.commitTerminalStop', 'terminal_commit'),
            ('        const committed = await manual.replayManualReconciliation', 'committed_replay')):
              assert block.count(needle) == 1, needle
              block = block.replace(needle, '        phase = \"' + stage + '\";\n' + needle)
          block = block.replace('        return committed;\n', '''        return committed;
                  } catch (error) {
                    try {
                      const safe: Record<string,string> = __LABELS__, labels: string[] = []; let item: unknown = error;
                      for (let i = 0; i < 5 && item instanceof Error; i++) {
                        const msg = Object.getOwnPropertyDescriptor(item, 'message')?.value;
                        const code = Object.getOwnPropertyDescriptor(item, 'code')?.value;
                        const errcode = Object.getOwnPropertyDescriptor(item, 'errcode')?.value;
                        labels.push(typeof msg === 'string' && Object.hasOwn(safe, msg) ? safe[msg]!
                          : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|REVISION_CONFLICT|LEASE_FENCED|STATE_TRANSITION_INVALID|INVALID_REQUEST|ERR_SQLITE_ERROR|ERR_NODE_SQLITE_ERROR)$/u.test(code)
                           ? code.toLowerCase() + (Number.isInteger(errcode) && errcode >= 0 && errcode < 1024 ? '_' + errcode : '') : item instanceof TypeError ? 'type' : 'other');
                        item = Object.getOwnPropertyDescriptor(item, 'cause')?.value;
                      }
                      process.stderr.write('CLIQ_PR536_HTTP_RECOVERY_manual_' + phase + '__' + labels.join('__') + '\\n');
                    } catch {}
                    throw error;
                  }
          '''.replace('__LABELS__', json.dumps(labels)))
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Observe exact progress at the original two-second Supervisor stop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def instrument(name, anchor, before, after):
              path = Path('src/state') / name
              source = path.read_text()
              start = source.index(anchor)
              prefix, rest = source[:start], source[start:]
              def mark(label):
                  return "    try { process.stderr.write('CLIQ_PR536_HTTP_RECOVERY_stop_" + label + chr(92) + "n'); } catch {}"
              for needle, label in before:
                  assert rest.count(needle) == 1, needle
                  rest = rest.replace(needle, mark(label) + chr(10) + needle)
              for needle, label in after:
                  assert rest.count(needle) == 1, needle
                  rest = rest.replace(needle, needle + chr(10) + mark(label))
              path.write_text(prefix + rest)
          instrument('installed-entry.ts', 'function close(): Promise<void>', [
              ('    await service?.close();', 'service_enter'),
              ('    await store?.close();', 'store_enter')
          ], [
              ('    await joinResourceOperations([Promise.resolve().then(() => anchor?.close()), selected?.close()] as const);', 'installed_runtime_joined'),
          ])
          instrument('store.ts', '  close(): Promise<void> {', [
              ('      const admissionJoins = await Promise.allSettled', 'admissions_enter'),
              ('      const mcpAdminJoins = await Promise.allSettled', 'mcp_admin_enter'),
              ('      const brokerJoins = await Promise.allSettled', 'broker_enter'),
              ('      const driverJoins = await Promise.allSettled', 'drivers_enter'),
              ('      const maintenanceJoins = await Promise.allSettled', 'maintenance_enter'),
              ('      const closureJoins = await Promise.allSettled', 'model_closure_enter'),
              ('      const localInferenceJoins = await Promise.allSettled', 'local_enter'),
              ('        await retireAbandonedPreactivations(this.driver', 'preactivations_enter'),
              ('        await gracefullyReleaseStateOwner(this.driver, this.artifacts, this.owner);', 'owner_enter'),
          ], [
              ('      this.closed = true;', 'store_joined')
          ])
          PY
      - name: Select only the unchanged HTTP UNKNOWN restart and original deadline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-mcp-journey.ts')
          source = p.read_text()
          anchor = '  for (const kind of INSTALLED_MCP_CASES) {'
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + "\n    if (kind !== 'unknown_after_effect_restart') continue;")
          p.write_text(source)
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          trap 'sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat --grep "^CLIQ_PR536_HTTP_RECOVERY_" | /bin/grep -E "^CLIQ_PR536_HTTP_RECOVERY_[a-z0-9_]{1,650}$" | sort | uniq -c | head -30 || true' EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

