name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery-delayed-volume:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-model-prep-delay' && inputs.expected_revision == 'cf9d393f8767f1100dcf8cbf1ee44c3bb4f9d3dd' }}
    name: Linux installed Delivery on owned delayed storage
    # A separate free standard disposable VM, not a host/global-disk fixture.
    # This retains the ordinary complete Delivery assertions. Fixed timing
    # diagnostics do not qualify a late result or an in-flight stop by themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/supervisor-sea-builder.test.ts scripts/kernel/testing/installed-publication-retirement.test.ts scripts/kernel/testing/installed-publication-journal.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts
      - run: npm run build
        id: build
      - name: Install actual guest, Secret Service and owned-volume prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config dmsetup kmod
      - name: Exercise both actual Linux root protocol-child lifetimes
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo "$probe_node" --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-publication-crash-observer.test.ts
      - name: Require the disposable hosted VM and its actual fixed delay target
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          if [[ ! -d /sys/module/dm_delay ]]; then sudo /usr/sbin/modprobe dm_delay; fi
          sudo /usr/bin/udevadm settle --timeout=5
          test -d /sys/module/dm_mod
          test -d /sys/module/dm_delay
          test -c /dev/mapper/control
      - name: Exercise the unchanged installed Delivery closure on the unique owned delayed volume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --delay-volume --run-delivery-delay-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-delayed-volume"
      - name: Retain only bounded reports and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-delayed-volume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-delayed-volume/*.json
          if-no-files-found: warn
          retention-days: 7

