name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-http-client' && inputs.expected_revision == '34fbc7452bf659f9f108064b347e191e8848ec02' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Observe fixed MCP client-case phases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kernel/testing/installed-mcp-journey.ts')
          s = p.read_text()
          def mark(needle, label):
              global s
              assert s.count(needle) == 1, needle
              s = s.replace(needle, '    if (!installedMcpKnown(kind)) context.mark(\x60mcp_\x24{kind}_'+ label +'\x60);\n' + needle)
          mark('    const by = Date.now() + 90_000;', 'await_wait')
          mark('    const mcp = cut.journal.filter((row: Data) => row.opKind', 'await_settlement')
          mark('    same(cut.snapshot.run.budgetReserved, ZERO); await context.assertWorkerFree(runId, cut);', 'await_worker_retirement')
          mark('    await context.assertEndpointJoined(kind, by);', 'await_endpoint_join')
          mark('    const expectedExternalCalls =', 'await_external_counts')
          mark('    await context.reconnect(); same(await get(runId), cut);', 'await_reconnect')
          mark('      const wait = decodeManualInvocationWait(await read(cut.snapshot.run.waitingOnRef));', 'await_wait_proof')
          mark("      if (kind === 'unknown_after_effect_restart')", 'await_restart')
          mark('      let cancel: Data | undefined;', 'await_cancel_or_stale')
          mark('      const acknowledgement = signed(', 'await_abandon')
          mark('      await context.restart(); same(await get(runId), cut); assert.deepEqual(await context.send(acknowledgement, 30_000), response);', 'await_abandon_replay')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

