name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-mcp:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-mcp-reserve' && inputs.expected_revision == '81a9f8d0a1f4734f916d520b6ff9db4b739b9e5b' }}
    name: Linux signed installed MCP and manual recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Add fixed diagnostic-only native reserve labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('native/linux/mcp-http-admin-native.h')
          source = p.read_text()
          start = source.index('    if (napi_get_cb_info', source.index('static napi_value reserve_mcp_admin('))
          end = source.index('    struct mcp_admin_native_scope *scope', start)
          original = source[start:end]
          body = original.removeprefix('    if (').split(')\n        return failure', 1)[0]
          checks = re.split(r'\s+\|\|\s+', body)
          names = ('callback argc controller_tag controller_env controller_pid thread closed ready pending mcp_admin source retained '
                   'input_tag input_abi input_pid input_env input_assert_method input_current input_retire input_closed input_claimed '
                   'helper_tag helper_fd bwrap_tag bwrap_fd guest_tag guest_abi guest_ready guest_revoked guest_empty guest_bound guest_node '
                   'script_tag script_fd script_empty script_bound script_digest recipe_buffer_type recipe_buffer recipe_info recipe_empty recipe_bound placement').split()
          assert len(checks) == len(names), (len(checks), len(names))
          replacement = '    const char *rejected = NULL;\n' + ''.join(
              f'    {"else " if i else ""}if ({condition.strip()}) rejected = "{name}";\n'
              for i, (name, condition) in enumerate(zip(names, checks))
          )
          replacement += '''    if (rejected) {
                  fprintf(stderr, "CLIQ_PR536_MCP_RESERVE_%s\\n", rejected);
                  return failure(env, "Admin MCP requires original physical input and exact signed fixed images");
              }
          '''
          p.write_text(source[:start] + replacement + source[end:])
          PY
      - run: npm run build
      - name: Check bounded build cancellation and actual child joining
        run: node --test scripts/kernel/testing/bounded-native-build.test.mjs
      - name: Check the owned service and model responses
        run: >-
          node --test --test-concurrency=1 --import tsx
          scripts/kernel/testing/installed-mcp-responder.test.ts
          scripts/kernel/testing/installed-mcp-model.test.ts
          scripts/kernel/testing/installed-mcp-http.test.ts
      - name: Install the original native, systemd and credential prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Check actual native parsers and NoEcho without manufacturing authority
        run: node --test --test-concurrency=1 --import tsx scripts/kernel/testing/mcp-native-data.test.ts
      - name: Qualify the actual signed installation on the free Linux runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          probe_since=$(date +%s)
          report_mcp_reserve_marks() {
            sudo /usr/bin/journalctl --since "@$probe_since" --no-pager --output=cat \
              --grep '^CLIQ_PR536_MCP_RESERVE_[a-z_]+' |
              /bin/grep -E '^CLIQ_PR536_MCP_RESERVE_[a-z_]+$' |
              head -30 || true
          }
          trap report_mcp_reserve_marks EXIT
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --run-mcp-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-mcp-journey"
      - name: Preserve bounded JSON qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-mcp-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-mcp-journey/*.json
          if-no-files-found: warn

