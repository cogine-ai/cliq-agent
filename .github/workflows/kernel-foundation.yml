name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  installed-runtime-upgrade:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-upgrade-sqlite' && inputs.expected_revision == '3a7350cd28346f3892653dd5c6d7f37a7af5e4f2' }}
    name: Actual installed signed schema7 to schema8 upgrade
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check complete source and controlled publisher components
        run: node --test --import tsx scripts/kernel/testing/qualification-source.test.ts src/state/testing/qualification-publisher.test.ts
      - name: Obtain the actual original product source without build artifacts
        shell: bash
        run: |
          set -euo pipefail
          old_commit=25130cfec913bddaff4d0a8c7ff4aac7ef2db932
          old_tree=2bce7193ce7f7dd9d073e6badfb2093fb912d9e7
          git fetch --no-tags --depth=1 origin "$old_commit"
          test "$(git rev-parse "$old_commit^{commit}")" = "$old_commit"
          test "$(git rev-parse "$old_commit^{tree}")" = "$old_tree"
          mkdir -m 0700 "$RUNNER_TEMP/cliq-upgrade-source7"
          git archive --format=tar "$old_commit" | tar -xf - -C "$RUNNER_TEMP/cliq-upgrade-source7"
          # The driver independently checks all1178 logical modes/fullSHA256,
          # ordered JCS inventory SHA256, count and byte total before copying.
      - name: Classify a failed signed selection using fixed diagnostic labels only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          labels = {}
          for file in ('installed-runtime.ts', 'state-owner-history.ts', 'runtime-upgrade.ts', 'runtime-upgrade-resources.ts',
            'state-owner.ts', 'cas.ts', 'sqlite-driver.ts', 'model-authority.ts'):
              path = Path('src/state') / file
              if not path.is_file(): continue
              for message in re.findall(r"'([A-Za-z][a-zA-Z0-9 _/,-]{10,130})'", path.read_text()):
                  labels[message] = re.sub(r'[^a-z0-9]+', '_', message.lower()).strip('_')
          p = Path('scripts/kernel/testing/installed-control-client-driver.ts')
          s = p.read_text()
          needle = '    failure = error; failedPhase = phase;'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
              if (phase === 'selection') try {
                const fixed: Record<string, string> = __LABELS__;
                const labels: string[] = [];
                let item: unknown = error;
                for (let i = 0; i < 5 && item instanceof Error; i++) {
                  const message = Object.getOwnPropertyDescriptor(item, 'message')?.value;
                  const code = Object.getOwnPropertyDescriptor(item, 'code')?.value;
                  labels.push(typeof message === 'string' && Object.hasOwn(fixed, message) ? fixed[message]!
                    : typeof code === 'string' && /^(RECOVERY_REQUIRED|ARTIFACT_MISMATCH|REVISION_CONFLICT|ERR_ASSERTION|ERR_SQLITE_ERROR|ENOENT|EACCES)$/u.test(code)
                      ? code.toLowerCase() : item instanceof TypeError ? 'type' : 'other');
                  item = Object.getOwnPropertyDescriptor(item, 'cause')?.value;
                }
                writeSync(2, 'CLIQ_PR536_UPGRADE_SELECTION_' + labels.join('__').slice(0, 400) + '\\n');
              } catch {}
          '''.replace('__LABELS__', json.dumps(labels)))
          p.write_text(s)
          p = Path('scripts/kernel/testing/installed-client-consumer.ts')
          s = p.read_text()
          needle = '        if (!marker) {'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '''
                    if (/^CLIQ_PR536_UPGRADE_SELECTION_[a-z0-9_]{1,400}\\n$/u.test(line.toString('ascii'))) {
                      markerBytes += line.length; try { writeSync(2, line); } catch {} continue;
                    }
          ''')
          s = s.replace('authProcessPrefix, INSTALLED_REQUEST_FAILURE_PREFIX].some', "authProcessPrefix, INSTALLED_REQUEST_FAILURE_PREFIX, 'CLIQ_PR536_UPGRADE_SELECTION_'].some")
          p.write_text(s)
          PY
      - name: Capture the fixed SQLite upgrade failure class
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/state/installed-upgrade-diagnostics.ts')
          source = p.read_text()
          anchor = "  'NATIVE_PLATFORM_REFUSED', 'TYPE_ERROR',"
          assert source.count(anchor) == 1
          source = source.replace(anchor, "  'SQLITE_BUSY', 'SQLITE_LOCKED', 'SQLITE_READONLY', 'SQLITE_IOERR', 'SQLITE_CANTOPEN', 'SQLITE_OTHER',\n" + anchor)
          anchor = "      if (native === 'ERR_CLIQ_CREDENTIAL_PLATFORM') {"
          assert source.count(anchor) == 1
          source = source.replace(anchor, """      if (native === 'ERR_SQLITE_ERROR') {
                  const property = Object.getOwnPropertyDescriptor(error, 'errcode');
                  const value = property && 'value' in property ? property.value : undefined;
                  const primary = typeof value === 'number' && Number.isSafeInteger(value) ? value & 0xff : undefined;
                  switch (primary) {
                    case 5: code = 'SQLITE_BUSY'; break;
                    case 6: code = 'SQLITE_LOCKED'; break;
                    case 8: code = 'SQLITE_READONLY'; break;
                    case 10: code = 'SQLITE_IOERR'; break;
                    case 14: code = 'SQLITE_CANTOPEN'; break;
                    default: code = 'SQLITE_OTHER';
                  }
                } else if (native === 'ERR_CLIQ_CREDENTIAL_PLATFORM') {""")
          p.write_text(source)
          PY
      - run: npm run build
        id: build
      - name: Install the unchanged actual systemd, credential and native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config
      - name: Exercise the formal upgrade entry and explicit new runtime authorization
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --runtime-upgrade-journey "$RUNNER_TEMP/cliq-upgrade-source7" "$probe_node" "$RUNNER_TEMP/cliq-installed-runtime-upgrade"
      - name: Retain bounded independent upgrade scope and original cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-runtime-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-runtime-upgrade/*.json
          if-no-files-found: warn
          retention-days: 7
  # Public-repository qualification stays on free standard GitHub-hosted
  # runners. Do not switch these jobs to larger/paid runner labels.

