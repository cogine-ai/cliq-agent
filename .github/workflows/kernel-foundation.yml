name: PR 536 targeted Linux diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact reviewed source revision for the unchanged selected jobs
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-installed-delivery-delayed-volume:
    if: ${{ github.repository == 'cogine-ai/cliq-agent' && github.ref == 'refs/heads/validation/cliq-pr536-delayed-model-cut' && inputs.expected_revision == 'ebe79a7244e69e872cae55841daa91709f9b04eb' }}
    name: Linux installed Delivery on owned delayed storage
    # A separate free standard disposable VM, not a host/global-disk fixture.
    # This retains the ordinary complete Delivery assertions. Fixed timing
    # diagnostics do not qualify a late result or an in-flight stop by themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/kernel/testing/installed-volume-guard.test.mjs scripts/kernel/testing/installed-delivery-journey.test.mjs
      - run: node --test --import tsx scripts/kernel/testing/supervisor-sea-builder.test.ts scripts/kernel/testing/installed-publication-retirement.test.ts scripts/kernel/testing/installed-publication-journal.test.ts scripts/kernel/testing/installed-publication-crash-observer.test.ts scripts/kernel/testing/installed-publication-recovery.test.ts
      - name: Locate the first delayed-volume model release cut
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/state/store.ts')
          source = store.read_text()
          start = source.index('        const gate = async <T>(release: () => Promise<T>): Promise<T> => {')
          end = source.index('        receivedResponse = true;', start)
          section = source[start:end]
          header = '        const gate = async <T>(release: () => Promise<T>): Promise<T> => {'
          section = section.replace(header, """        const releaseStarted = performance.now();
                  function noteRelease(phase: string) {
                    try {
                      process.stderr.write('CLIQ_PR536_MODEL_RELEASE ' + phase + ' ' +
                        Math.min(180000, Math.max(0, Math.floor(performance.now() - releaseStarted))) + '\\n');
                    } catch { /* Log only fixed stage and relative time. */ }
                  }
                  let releaseGate = 0;
          """ + header + """
                    const ordinal = ++releaseGate;
                    noteRelease(ordinal === 1 ? 'connect_cut_started' : 'body_cut_started');""")
          points = {
            '          const cut = await readModelClaimCut(this.driver, this.artifacts, prepared);':
              ('after', "          noteRelease(ordinal === 1 ? 'connect_cut_returned' : 'body_cut_returned');"),
            '          return release();':
              ('before', "          noteRelease(ordinal === 1 ? 'connect_io_started' : 'body_io_started');"),
            '        await gate(() => transport!.connect(binding));':
              ('after', "        noteRelease('connect_io_returned');"),
            '        const response = await gate(() => transport!.releaseBody(binding));':
              ('after', "        noteRelease('body_io_returned');"),
          }
          for line, (position, note) in points.items():
              assert section.count(line) == 1
              section = section.replace(line, line + '\n' + note if position == 'after' else note + '\n' + line)
          store.write_text(source[:start] + section + source[end:])

          driver = Path('scripts/kernel/testing/installed-node-journey.ts')
          source = driver.read_text()
          anchor = '                resourceLog.stdout.fill(0); resourceLog.stderr.fill(0); assertRetained();'
          assert source.count(anchor) == 1
          driver.write_text(source.replace(anchor, """
                          if (!resourceLog.error && !resourceLog.signal && resourceLog.status === 0) {
                            for (const line of resourceLog.stdout.toString('utf8').split('\\n').filter(line =>
                              /^CLIQ_PR536_MODEL_RELEASE (?:connect_cut_started|connect_cut_returned|connect_io_started|connect_io_returned|body_cut_started|body_cut_returned|body_io_started|body_io_returned) [0-9]{1,6}$/u.test(line)).slice(0, 64)) {
                              const bytes = Buffer.from(line + '\\n', 'ascii');
                              assert.equal(writeResourceDiagnostic(2, bytes), bytes.length);
                            }
                          }
          """ + anchor))
          PY
      - run: npm run build
        id: build
      - name: Install actual guest, Secret Service and owned-volume prerequisites
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libglib2.0-dev libssl-dev musl-tools bubblewrap libcap-dev libselinux1-dev meson ninja-build e2fsprogs libext2fs-dev pkg-config dmsetup kmod
      - name: Exercise both actual Linux root protocol-child lifetimes
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo "$probe_node" --test --test-concurrency=1 --import tsx scripts/kernel/testing/installed-publication-crash-observer.test.ts
      - name: Require the disposable hosted VM and its actual fixed delay target
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          if [[ ! -d /sys/module/dm_delay ]]; then sudo /usr/sbin/modprobe dm_delay; fi
          sudo /usr/bin/udevadm settle --timeout=5
          test -d /sys/module/dm_mod
          test -d /sys/module/dm_delay
          test -c /dev/mapper/control
      - name: Exercise the unchanged installed Delivery closure on the unique owned delayed volume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          probe_node=$(realpath "$(command -v node)")
          sudo /bin/bash scripts/kernel/qualify-systemd-user.sh --delay-volume --run-delivery-delay-journey "$probe_node" "$RUNNER_TEMP/cliq-installed-delivery-delayed-volume"
      - name: Retain only bounded reports and unchanged-runner cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-delivery-delayed-volume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cliq-installed-delivery-delayed-volume/*.json
          if-no-files-found: warn
          retention-days: 7

